<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>官公庁マスタ - LAPIS2</title>
    <link rel="stylesheet" href="style_v2.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="dashboard-container">
        <header class="unified-header">
            <div class="unified-header-tier1">
                <nav class="unified-nav">
                    <a href="index.html" class="unified-nav-item">案件管理</a>
                    <span class="nav-separator">|</span>
                    <a href="customer_list.html" class="unified-nav-item">顧客管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_list.html" class="unified-nav-item">許認可管理</a>
                    <span class="nav-separator">|</span>
                    <a href="invoice_list.html" class="unified-nav-item">請求管理</a>
                    <span class="nav-separator">|</span>
                    <a href="sales_list.html" class="unified-nav-item">売上管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_washout.html" class="unified-nav-item">決算期別</a>
                    <span class="nav-separator">|</span>
                    <a href="staff_list.html" class="unified-nav-item">担当者管理</a>
                    <span class="nav-separator">|</span>
                    <a href="government_office_list.html" class="unified-nav-item active">官公庁マスタ</a>
                </nav>
            </div>
            <div class="unified-header-tier2">
                <h1 id="page-title">官公庁マスタ</h1>
            </div>
            <div class="unified-header-tier3">
                <button class="primary-btn" id="btn-new-office">+ 新規登録</button>
            </div>
        </header>

        <header class="dashboard-header" style="display: none;">
            <div class="brand">
                <h1>LAPIS2</h1>
                <p class="subtitle">Government Office Master</p>
            </div>
            <div class="header-actions">
                <nav class="main-nav">
                    <a href="index.html" class="nav-item">案件管理</a>
                    <a href="customer_list.html" class="nav-item">顧客管理</a>
                    <a href="license_list.html" class="nav-item">許認可管理</a>
                    <a href="staff_list.html" class="nav-item">担当者管理</a>
                    <a href="government_office_list.html" class="nav-item active">官公庁マスタ</a>
                </nav>
                <button class="primary-btn" id="btn-new-office-old">
                    <span class="icon">＋</span> 新規追加
                </button>
            </div>
        </header>

        <!-- Page Title -->
        <section style="display: none;">
            <h2 style="font-size: 1.5rem; font-weight: 600; color: #1e293b;">官公庁マスタ</h2>
            <p style="color: var(--text-muted); margin-top: 8px;">管轄官公庁の情報を管理します。</p>
        </section>

        <!-- Filter Section -->
        <section class="filter-glass">
            <div style="display: flex; gap: 24px; flex-wrap: wrap; align-items: flex-end;">
                <div class="filter-group">
                    <label for="filter-prefecture">都道府県</label>
                    <select id="filter-prefecture">
                        <option value="">すべて</option>
                        <option value="北海道">北海道</option>
                        <option value="青森県">青森県</option>
                        <option value="岩手県">岩手県</option>
                        <option value="宮城県">宮城県</option>
                        <option value="秋田県">秋田県</option>
                        <option value="山形県">山形県</option>
                        <option value="福島県">福島県</option>
                        <option value="茨城県">茨城県</option>
                        <option value="栃木県">栃木県</option>
                        <option value="群馬県">群馬県</option>
                        <option value="埼玉県">埼玉県</option>
                        <option value="千葉県">千葉県</option>
                        <option value="東京都">東京都</option>
                        <option value="神奈川県">神奈川県</option>
                        <option value="新潟県">新潟県</option>
                        <option value="富山県">富山県</option>
                        <option value="石川県">石川県</option>
                        <option value="福井県">福井県</option>
                        <option value="山梨県">山梨県</option>
                        <option value="長野県">長野県</option>
                        <option value="岐阜県">岐阜県</option>
                        <option value="静岡県">静岡県</option>
                        <option value="愛知県">愛知県</option>
                        <option value="三重県">三重県</option>
                        <option value="滋賀県">滋賀県</option>
                        <option value="京都府">京都府</option>
                        <option value="大阪府">大阪府</option>
                        <option value="兵庫県">兵庫県</option>
                        <option value="奈良県">奈良県</option>
                        <option value="和歌山県">和歌山県</option>
                        <option value="鳥取県">鳥取県</option>
                        <option value="島根県">島根県</option>
                        <option value="岡山県">岡山県</option>
                        <option value="広島県">広島県</option>
                        <option value="山口県">山口県</option>
                        <option value="徳島県">徳島県</option>
                        <option value="香川県">香川県</option>
                        <option value="愛媛県">愛媛県</option>
                        <option value="高知県">高知県</option>
                        <option value="福岡県">福岡県</option>
                        <option value="佐賀県">佐賀県</option>
                        <option value="長崎県">長崎県</option>
                        <option value="熊本県">熊本県</option>
                        <option value="大分県">大分県</option>
                        <option value="宮崎県">宮崎県</option>
                        <option value="鹿児島県">鹿児島県</option>
                        <option value="沖縄県">沖縄県</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-type">種別</label>
                    <select id="filter-type">
                        <option value="">すべて</option>
                        <option value="都道府県">都道府県</option>
                        <option value="市区町村">市区町村</option>
                        <option value="国">国</option>
                        <option value="その他">その他</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-office-name">官公庁名</label>
                    <input type="text" id="filter-office-name" placeholder="官公庁名で検索">
                </div>
                <div class="filter-group" style="padding-bottom: 8px;">
                    <div style="display: flex; align-items: center; gap: 8px;">
                        <input type="checkbox" id="filter-status-active" checked style="width: 18px; height: 18px;">
                        <label for="filter-status-active"
                            style="cursor: pointer; text-transform: none; font-size: 1rem; margin-bottom: 0;">有効のみ表示</label>
                    </div>
                </div>
                <div class="filter-actions" style="margin-left: auto; display: flex; gap: 12px; padding-bottom: 4px;">
                    <button class="secondary-btn" id="btn-reset">リセット</button>
                    <button class="primary-btn" id="btn-search">検索</button>
                </div>
            </div>
        </section>

        <!-- Table Section -->
        <section id="results-section" class="table-glass" style="display: none;">
            <div class="table-wrapper">
                <table id="office-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="office_id" style="width: 8%; text-align: left;">ID</th>
                            <th class="sortable" data-sort="office_name" style="width: 32%; text-align: left;">官公庁名</th>
                            <th class="sortable" data-sort="office_prefecture" style="width: 20%; text-align: left;">
                                都道府県</th>
                            <th class="sortable" data-sort="office_type" style="width: 20%; text-align: left;">種別</th>
                            <th class="sortable" data-sort="status" style="width: 20%; text-align: left;">状態</th>
                        </tr>
                    </thead>
                    <tbody id="office-list-body">
                        <!-- JSで動的に追加 -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer style="margin-top: 60px;">
            <p>&copy; 2026 LAPIS2 Project</p>
        </footer>
    </main>

    <button id="back-to-top" class="back-to-top">↑</button>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="government_office_list.js"></script>
</body>

</html>
