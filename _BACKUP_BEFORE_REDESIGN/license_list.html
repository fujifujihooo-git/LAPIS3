<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>許認可管理 - LAPIS2</title>
    <link rel="stylesheet" href="style_v2.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <main class="dashboard-container">
        <header class="unified-header">
            <div class="unified-header-tier1">
                <nav class="unified-nav">
                    <a href="index.html" class="unified-nav-item">案件管理</a>
                    <span class="nav-separator">|</span>
                    <a href="customer_list.html" class="unified-nav-item">顧客管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_list.html" class="unified-nav-item active">許認可管理</a>
                    <span class="nav-separator">|</span>
                    <a href="invoice_list.html" class="unified-nav-item">請求管理</a>
                    <span class="nav-separator">|</span>
                    <a href="sales_list.html" class="unified-nav-item">売上管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_washout.html" class="unified-nav-item">決算期別</a>
                    <span class="nav-separator">|</span>
                    <a href="staff_list.html" class="unified-nav-item">担当者管理</a>
                    <span class="nav-separator">|</span>
                    <a href="government_office_list.html" class="unified-nav-item">官公庁マスタ</a>
                </nav>
            </div>
            <div class="unified-header-tier2">
                <h1 id="page-title">許認可管理</h1>
            </div>
            <div class="unified-header-tier3">
                <a href="license_types_list.html" class="secondary-btn">許認可種別マスタ</a>
                <button class="primary-btn" id="btn-new-license">+ 新規許認可登録</button>
            </div>
        </header>

        <header class="dashboard-header" style="display: none;">
            <div class="brand">
                <h1>LAPIS2</h1>
                <p class="subtitle">License Management</p>
            </div>
            <div class="header-actions">
                <nav class="main-nav">
                    <a href="index.html" class="nav-item">案件管理</a>
                    <a href="customer_list.html" class="nav-item">顧客管理</a>
                    <a href="license_list.html" class="nav-item active">許認可管理</a>
                    <a href="staff_list.html" class="nav-item">担当者管理</a>
                    <a href="government_office_list.html" class="nav-item">官公庁マスタ</a>
                </nav>
                <button class="primary-btn" id="btn-new-license-old">
                    <span class="icon">＋</span> 新規許認可登録
                </button>
            </div>
        </header>

        <!-- Page Title -->
        <section style="display: none;">
            <div>
                <h2 style="font-size: 1.5rem; font-weight: 600; color: #1e293b;">許認可管理</h2>
                <p style="color: var(--text-muted); margin-top: 8px;">顧客の許認可情報を管理します。</p>
            </div>
            <div>
                <a href="license_types_list.html" class="secondary-btn">許認可種別マスタ</a>
            </div>
        </section>

        <!-- Filter Section -->
        <section class="filter-glass">
            <div class="filter-group">
                <label for="filter-customer">顧客名</label>
                <input type="text" id="filter-customer" placeholder="顧客名で検索...">
            </div>
            <div class="filter-group">
                <label for="filter-license-type">許認可種別</label>
                <select id="filter-license-type">
                    <option value="">すべて</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-status">状態</label>
                <select id="filter-status">
                    <option value="有効">有効</option>
                    <option value="">すべて</option>
                    <option value="失効">失効</option>
                    <option value="取消">取消</option>
                </select>
            </div>
            <div class="filter-group" style="display: flex; align-items: center; gap: 8px;">
                <input type="checkbox" id="filter-notice-due" style="width: auto; margin: 0;">
                <label for="filter-notice-due" style="margin: 0; cursor: pointer;">案内日が今日以前（対応要）</label>
            </div>
            <div class="filter-group" style="align-self: flex-end;">
                <button id="btn-search-execute" class="primary-btn"
                    style="height: 38px; white-space: nowrap;">検索</button>
            </div>
        </section>

        <!-- License List Table -->
        <section class="table-glass">
            <div class="table-wrapper">
                <table id="license-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="customer_name">顧客名</th>
                            <th class="sortable" data-sort="license_type_name">許認可種別</th>
                            <th class="sortable" data-sort="license_number">番号</th>
                            <th class="sortable" data-sort="expiry_date">期限（満了日）</th>
                            <th class="sortable" data-sort="remaining_days">残り日数</th>
                            <th class="sortable" data-sort="notice_date">案内日</th>
                            <th class="sortable" data-sort="notice_remaining">案内まで</th>
                            <th class="sortable" data-sort="status">状態</th>
                        </tr>
                    </thead>
                    <tbody id="license-list-body">
                        <!-- JSで動的に追加 -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer style="margin-top: 60px;">
            <p>&copy; 2026 LAPIS2 Project</p>
        </footer>
    </main>

    <button id="back-to-top" class="back-to-top">↑</button>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="license_list.js"></script>
</body>

</html>
