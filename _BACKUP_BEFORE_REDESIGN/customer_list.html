<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPIS2 - 顧客管理</title>
    <link rel="stylesheet" href="style_v2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="dashboard-container">
        <header class="unified-header">
            <div class="unified-header-tier1">
                <nav class="unified-nav">
                    <a href="index.html" class="unified-nav-item">案件管理</a>
                    <span class="nav-separator">|</span>
                    <a href="customer_list.html" class="unified-nav-item active">顧客管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_list.html" class="unified-nav-item">許認可管理</a>
                    <span class="nav-separator">|</span>
                    <a href="invoice_list.html" class="unified-nav-item">請求管理</a>
                    <span class="nav-separator">|</span>
                    <a href="sales_list.html" class="unified-nav-item">売上管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_washout.html" class="unified-nav-item">決算期別</a>
                    <span class="nav-separator">|</span>
                    <a href="staff_list.html" class="unified-nav-item">担当者管理</a>
                    <span class="nav-separator">|</span>
                    <a href="government_office_list.html" class="unified-nav-item">官公庁マスタ</a>
                </nav>
            </div>
            <div class="unified-header-tier2">
                <h1 id="page-title">顧客管理</h1>
            </div>
            <div class="unified-header-tier3">
                <button class="primary-btn" id="btn-new-customer">+ 新規顧客登録</button>
            </div>
        </header>

        <header class="dashboard-header" style="display: none;">
            <div class="brand">
                <h1>LAPIS2</h1>
                <p class="subtitle">Customer Management System</p>
            </div>
            <div class="header-actions">
                <nav class="main-nav">
                    <a href="index.html" class="nav-item">案件管理</a>
                    <a href="customer_list.html" class="nav-item active">顧客管理</a>
                    <a href="license_list.html" class="nav-item">許認可管理</a>
                    <a href="staff_list.html" class="nav-item">担当者管理</a>
                    <a href="government_office_list.html" class="nav-item">官公庁マスタ</a>
                </nav>
                <button class="primary-btn" id="btn-new-customer-old">
                    <span class="icon">＋</span> 新規顧客登録
                </button>
            </div>
        </header>

        <!-- Filter Section -->
        <section class="filter-glass">
            <div class="filter-group">
                <label for="filter-status">状態</label>
                <select id="filter-status">
                    <option value="">すべて</option>
                    <option value="稼働中" selected>稼働中</option>
                    <option value="休眠">休眠</option>
                    <option value="取引終了">取引終了</option>
                </select>
            </div>
            <div class="filter-group search-box" style="flex: 2;">
                <label for="filter-search">顧客名・フリガナ</label>
                <input type="text" id="filter-search" placeholder="顧客名またはカナで検索...">
            </div>
            <div class="filter-group" style="flex: 1.5;">
                <label for="filter-phone">電話番号</label>
                <div style="display: flex; gap: 8px;">
                    <input type="text" id="filter-phone" placeholder="番号で検索（ハイフン可）...">
                    <button id="btn-search-execute" class="primary-btn" style="white-space: nowrap;">検索</button>
                </div>
            </div>
            <div class="filter-group" style="justify-content: flex-end; padding-bottom: 0;">
                <button class="secondary-btn" id="btn-reset-filters"
                    style="height: 44px; white-space: nowrap;">すべてリセット</button>
            </div>
        </section>

        <!-- Initial Message -->
        <div id="initial-message" class="filter-glass" style="text-align: center; padding: 40px; margin-top: 24px;">
            <p style="color: var(--text-muted); font-size: 1.1rem;">顧客名または電話番号で検索してください。</p>
        </div>

        <!-- Count Display -->
        <div id="count-display-area"
            style="margin-top: 24px; margin-bottom: 12px; display: none; justify-content: flex-end; font-size: 0.9rem; color: var(--text-muted);">
            <div id="count-display">表示件数：0件</div>
        </div>

        <!-- Customer List Table -->
        <section class="table-glass" id="table-wrapper" style="display: none;">
            <div class="table-wrapper">
                <table id="customer-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="customer_id" style="width: 60px;">ID</th>
                            <th class="sortable" data-sort="status">状態</th>
                            <th class="sortable" data-sort="customer_name">顧客名</th>
                            <th class="sortable" data-sort="customer_type">区分</th>
                            <th class="sortable" data-sort="representative_name">代表者</th>
                            <th class="sortable" data-sort="phone">電話番号</th>
                            <th class="sortable" data-sort="last_updated">最終更新</th>
                        </tr>
                    </thead>
                    <tbody id="customer-list-body">
                        <!-- JSで動的に追加 -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 LAPIS2 Project</p>
        </footer>
    </main>

    <button id="back-to-top" class="back-to-top">↑</button>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="customer_list.js"></script>
</body>

</html>
