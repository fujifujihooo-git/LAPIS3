<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>請求詳細 - LAPIS2</title>
    <link rel="stylesheet" href="style_v2.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Modal Styles */
        .modal {
            display: none;
            position: fixed;
            z-index: 2000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(4px);
        }

        .modal-content {
            background-color: #fff;
            margin: 10% auto;
            padding: 24px;
            border-radius: 12px;
            width: 500px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        /* Summary Section */
        .summary-box {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            width: 300px;
            margin-left: auto;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
        }

        .summary-total {
            border-top: 1px solid #cbd5e1;
            margin-top: 12px;
            padding-top: 12px;
            font-size: 1.2rem;
            font-weight: 800;
            color: #1e293b;
        }

        .balance-info {
            margin-top: 20px;
            padding-top: 12px;
            border-top: 1px dashed #cbd5e1;
            text-align: right;
        }

        /* Autocomplete */
        .autocomplete-wrapper {
            position: relative;
        }

        .autocomplete-items {
            position: absolute;
            border: 1px solid #d4d4d4;
            border-bottom: none;
            border-top: none;
            z-index: 99;
            top: 100%;
            left: 0;
            right: 0;
            background-color: white;
            border-radius: 0 0 6px 6px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .autocomplete-items div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #d4d4d4;
        }

        .autocomplete-items div:hover {
            background-color: #e9e9e9;
        }
    </style>
</head>

<body>
    <main class="dashboard-container">
        <header class="unified-header">
            <div class="unified-header-tier1">
                <nav class="unified-nav">
                    <a href="index.html" class="unified-nav-item">案件管理</a>
                    <span class="nav-separator">|</span>
                    <a href="customer_list.html" class="unified-nav-item">顧客管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_list.html" class="unified-nav-item">許認可管理</a>
                    <span class="nav-separator">|</span>
                    <a href="invoice_list.html" class="unified-nav-item active">請求管理</a>
                    <span class="nav-separator">|</span>
                    <a href="sales_list.html" class="unified-nav-item">売上管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_washout.html" class="unified-nav-item">決算期別</a>
                    <span class="nav-separator">|</span>
                    <a href="staff_list.html" class="unified-nav-item">担当者管理</a>
                    <span class="nav-separator">|</span>
                    <a href="government_office_list.html" class="unified-nav-item">官公庁マスタ</a>
                </nav>
            </div>
            <div class="unified-header-tier2">
                <h1 id="page-title">新規請求作成</h1>
            </div>
            <div class="unified-header-tier3">
                <button class="secondary-btn" onclick="window.location.href='invoice_list.html'">← 一覧に戻る</button>
                <button class="secondary-btn" id="btn-back-to-customer">顧客詳細に戻る</button>
                <div style="flex: 1;"></div>
                <button class="danger-btn" id="btn-delete-invoice" style="display: none;">削除</button>
                <button class="primary-btn" id="btn-save-invoice">保存</button>
            </div>
        </header>

        <!-- Basic Info -->
        <section class="form-section">
            <h2>■ 基本情報</h2>
            <div class="form-grid">
                <div class="form-group autocomplete-wrapper" id="customer-select-group">
                    <label>顧客名<span class="required">*</span></label>
                    <input type="text" id="input-customer-search" placeholder="顧客を検索して選択..." autocomplete="off">
                    <input type="hidden" id="customer_id">
                    <div id="autocomplete-list" class="autocomplete-items"></div>
                </div>
                <div class="form-group" id="customer-display-group" style="display: none;">
                    <label>顧客名</label>
                    <div id="customer-name-display" style="padding: 10px; font-weight: 600;"></div>
                </div>
            </div>
            <div class="form-grid grid-customer-basic-r1" style="margin-top: 16px;">
                <div class="form-group">
                    <label>請求番号<span class="required">*</span></label>
                    <input type="text" id="invoice_number" placeholder="2025-001">
                </div>
                <div class="form-group">
                    <label>請求日<span class="required">*</span></label>
                    <input type="date" id="invoice_date">
                </div>
                <div class="form-group">
                    <label>支払期限</label>
                    <input type="date" id="due_date">
                </div>
            </div>
            <div class="form-grid grid-3-col" style="margin-top: 16px;">
                <div class="form-group">
                    <label>ステータス<span class="required">*</span></label>
                    <select id="status">
                        <option value="下書き">下書き</option>
                        <option value="発行済">発行済</option>
                        <option value="一部入金">一部入金</option>
                        <option value="入金済">入金済</option>
                        <option value="延滞">延滞</option>
                    </select>
                </div>
            </div>
        </section>

        <!-- Invoice Items -->
        <section class="form-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="margin-bottom: 0;">■ 請求明細</h2>
                <div>
                    <button class="secondary-btn" id="btn-import-estimate" style="margin-right: 8px;">案件から取込</button>
                    <button class="secondary-btn" id="btn-add-item">+ 明細追加</button>
                </div>
            </div>
            <div class="table-glass">
                <table id="item-table">
                    <thead>
                        <tr>
                            <th style="width: 10%;">種別</th>
                            <th style="width: 20%;">案件</th>
                            <th style="width: 25%;">内容</th>
                            <th style="width: 12%;">単価</th>
                            <th style="width: 8%;">数量</th>
                            <th style="width: 12%;">金額</th>
                            <th style="width: 8%;">課税</th>
                            <th style="width: 5%;">編集</th>
                        </tr>
                    </thead>
                    <tbody id="item-list-body">
                        <!-- 動的に追加 -->
                    </tbody>
                </table>
            </div>

            <!-- Total Summary Area -->
            <div style="margin-top: 24px;">
                <div class="summary-box">
                    <div class="summary-row">
                        <span>課税対象額</span>
                        <span id="display-subtotal-taxable">¥0</span>
                    </div>
                    <div class="summary-row">
                        <span>消費税(10%)</span>
                        <span id="display-tax-amount">¥0</span>
                    </div>
                    <div class="summary-row">
                        <span>非課税額</span>
                        <span id="display-subtotal-nontaxable">¥0</span>
                    </div>
                    <div class="summary-total">
                        <span>合計金額</span>
                        <span id="display-total-amount">¥0</span>
                    </div>
                </div>
            </div>
        </section>

        <!-- Payments Section -->
        <section class="form-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px;">
                <h2 style="margin-bottom: 0;">■ 入金記録</h2>
                <button class="secondary-btn" id="btn-add-payment">+ 入金追加</button>
            </div>
            <div class="table-glass">
                <table id="payment-table">
                    <thead>
                        <tr>
                            <th>入金日</th>
                            <th>入金額</th>
                            <th>入金方法</th>
                            <th>備考</th>
                            <th>削除</th>
                        </tr>
                    </thead>
                    <tbody id="payment-list-body">
                        <!-- 動的に追加 -->
                    </tbody>
                </table>
            </div>
            <div class="balance-info">
                <div style="font-size: 0.9rem; color: #64748b;">入金合計: <span id="display-payment-total">¥0</span></div>
                <div style="font-size: 1.1rem; font-weight: 700;">残高: <span id="display-balance">¥0</span></div>
            </div>
        </section>

        <!-- Remarks Section -->
        <section class="form-section">
            <h2>備考</h2>
            <div class="form-group">
                <textarea id="remarks" placeholder="備考を入力..."></textarea>
            </div>
        </section>

        <section class="footer-info">
            <p>登録日: <span id="created_date">-</span></p>
            <p>最終更新日: <span id="last_updated">-</span></p>
        </section>

        <footer class="no-print">
            <p>&copy; 2026 LAPIS2 Project</p>
        </footer>
    </main>

    <!-- Modals -->
    <!-- Item Modal -->
    <div id="item-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>明細追加</h3>
                <span style="cursor: pointer;" onclick="closeModal('item-modal')">&times;</span>
            </div>
            <div class="form-group">
                <label>種別</label>
                <select id="modal-item-type">
                    <option value="報酬">報酬</option>
                    <option value="立替金">立替金</option>
                    <option value="預かり金">預かり金</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label>案件（任意）</label>
                <select id="modal-case-id">
                    <option value="">-- 選択してください --</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label>内容</label>
                <input type="text" id="modal-description" placeholder="内容を入力...">
            </div>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 12px;">
                <div class="form-group">
                    <label>単価</label>
                    <input type="number" id="modal-unit-price" value="0">
                </div>
                <div class="form-group">
                    <label>数量</label>
                    <input type="number" id="modal-quantity" value="1">
                </div>
            </div>
            <div class="form-group checkbox-group" style="margin-top: 12px;">
                <input type="checkbox" id="modal-is-taxable" checked>
                <label for="modal-is-taxable">課税対象</label>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-left">
                    <button type="button" class="danger-btn" id="btn-modal-delete-item"
                        style="display: none;">削除</button>
                </div>
                <div class="modal-footer-right">
                    <button class="secondary-btn" onclick="closeModal('item-modal')">キャンセル</button>
                    <button class="primary-btn" id="btn-modal-add-item">追加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Estimate Import Modal -->
    <div id="import-modal" class="modal">
        <div class="modal-content" style="width: 700px;">
            <div class="modal-header">
                <h3>案件から見積を取込</h3>
                <span style="cursor: pointer;" onclick="closeModal('import-modal')">&times;</span>
            </div>
            <div class="form-group">
                <label>案件選択</label>
                <select id="import-case-select">
                    <option value="">-- 案件を選択してください --</option>
                </select>
            </div>
            <div
                style="margin-top: 16px; max-height: 300px; overflow-y: auto; border: 1px solid #e2e8f0; border-radius: 6px;">
                <table style="width: 100%; border-collapse: collapse;">
                    <thead>
                        <tr style="background: #f8fafc; text-align: left;">
                            <th style="padding: 8px; border-bottom: 1px solid #e2e8f0; width: 40px;"><input
                                    type="checkbox" id="import-check-all"></th>
                            <th style="padding: 8px; border-bottom: 1px solid #e2e8f0;">種別</th>
                            <th style="padding: 8px; border-bottom: 1px solid #e2e8f0;">内容</th>
                            <th style="padding: 8px; border-bottom: 1px solid #e2e8f0; text-align: right;">金額</th>
                        </tr>
                    </thead>
                    <tbody id="import-item-list">
                        <!-- Items will be populated here -->
                        <tr>
                            <td colspan="4" style="padding: 16px; text-align: center; color: #64748b;">案件を選択してください</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div class="modal-footer">
                <div class="modal-footer-right">
                    <button class="secondary-btn" onclick="closeModal('import-modal')">キャンセル</button>
                    <button class="primary-btn" id="btn-execute-import">選択した明細を取り込む</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Payment Modal -->
    <div id="payment-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>入金追加</h3>
                <span style="cursor: pointer;" onclick="closeModal('payment-modal')">&times;</span>
            </div>
            <div class="form-group">
                <label>入金日</label>
                <input type="date" id="modal-payment-date">
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label>入金額</label>
                <input type="number" id="modal-payment-amount" value="0">
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label>入金方法</label>
                <select id="modal-payment-method">
                    <option value="銀行振込">銀行振込</option>
                    <option value="現金">現金</option>
                    <option value="クレジットカード">クレジットカード</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            <div class="form-group" style="margin-top: 12px;">
                <label>備考</label>
                <input type="text" id="modal-payment-remarks" placeholder="備考...">
            </div>
            <div class="modal-footer">
                <div class="modal-footer-right">
                    <button class="secondary-btn" onclick="closeModal('payment-modal')">キャンセル</button>
                    <button class="primary-btn" id="btn-modal-add-payment">追加</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="invoice_detail.js"></script>
</body>

</html>
