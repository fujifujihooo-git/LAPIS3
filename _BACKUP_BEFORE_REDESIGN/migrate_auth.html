<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>LAPIS2 - ユーザー移行ツール</title>
    <link rel="stylesheet" href="style_v2.css">
    <style>
        body {
            padding: 40px;
            background: #f8fafc;
            font-family: sans-serif;
        }

        .tool-card {
            background: white;
            padding: 32px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            max-width: 800px;
            margin: 0 auto;
        }

        .log-area {
            background: #1e293b;
            color: #f8fafc;
            padding: 16px;
            border-radius: 8px;
            font-family: monospace;
            height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            white-space: pre-wrap;
        }

        .success {
            color: #4ade80;
        }

        .error {
            color: #f87171;
        }

        .info {
            color: #60a5fa;
        }
    </style>
</head>

<body>
    <div class="tool-card">
        <h1>Firebase Auth 移行ツール</h1>
        <p>このツールは Firestore の <code>staff</code> コレクションを読み込み、それぞれのメールアドレスとパスワードを Firebase Authentication に登録します。</p>

        <div style="margin: 24px 0; display: flex; gap: 12px;">
            <button id="btn-start" class="primary-btn">移行を開始する</button>
            <a href="login.html" class="secondary-btn">ログイン画面へ</a>
        </div>

        <div id="log" class="log-area">ログがここに表示されます...</div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        const logEl = document.getElementById('log');
        function writeLog(msg, type = 'info') {
            const span = document.createElement('span');
            span.className = type;
            span.textContent = `[${new Date().toLocaleTimeString()}] ${msg}\n`;
            logEl.appendChild(span);
            logEl.scrollTop = logEl.scrollHeight;
        }

        document.getElementById('btn-start').addEventListener('click', async () => {
            if (!confirm('移行を開始しますか？既に Auth に存在するユーザーはスキップされます。')) return;

            logEl.textContent = '';
            writeLog('移行プロセスを開始しました...', 'info');

            try {
                const snapshot = await db.collection('staff').get();
                writeLog(`${snapshot.size} 名のスタッフを検出しました。`, 'info');

                for (const doc of snapshot.docs) {
                    const data = doc.data();
                    const { email, password, staff_name } = data;

                    if (!email || !password) {
                        writeLog(`スキップ: ${staff_name} (メールアドレスまたはパスワードが未設定)`, 'error');
                        continue;
                    }

                    writeLog(`登録中: ${staff_name} (${email})...`, 'info');

                    try {
                        await firebase.auth().createUserWithEmailAndPassword(email, password);
                        writeLog(`成功: ${staff_name} を作成しました。`, 'success');
                    } catch (err) {
                        if (err.code === 'auth/email-already-in-use') {
                            writeLog(`通知: ${staff_name} は既に登録されています。`, 'success');
                        } else {
                            writeLog(`失敗: ${staff_name} - ${err.message}`, 'error');
                        }
                    }
                }

                writeLog('全ての処理が完了しました。', 'info');
                writeLog('Firebase Console の Authentication 画面でユーザーが作成されているか確認してください。', 'success');

            } catch (err) {
                writeLog(`エラー: ${err.message}`, 'error');
                console.error(err);
            }
        });
    </script>
</body>

</html>
