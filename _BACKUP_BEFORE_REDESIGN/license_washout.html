<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>決算期別一覧 - LAPIS2</title>
    <link rel="stylesheet" href="style_v2.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=Outfit:wght@400;700&display=swap"
        rel="stylesheet">
    <!-- SheetJS for Excel Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>

<body>
    <main class="dashboard-container">
        <header class="unified-header">
            <div class="unified-header-tier1">
                <nav class="unified-nav">
                    <a href="index.html" class="unified-nav-item">案件管理</a>
                    <span class="nav-separator">|</span>
                    <a href="customer_list.html" class="unified-nav-item">顧客管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_list.html" class="unified-nav-item">許認可管理</a>
                    <span class="nav-separator">|</span>
                    <a href="invoice_list.html" class="unified-nav-item">請求管理</a>
                    <span class="nav-separator">|</span>
                    <a href="sales_list.html" class="unified-nav-item">売上管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_washout.html" class="unified-nav-item active">決算期別</a>
                    <span class="nav-separator">|</span>
                    <a href="staff_list.html" class="unified-nav-item">担当者管理</a>
                    <span class="nav-separator">|</span>
                    <a href="government_office_list.html" class="unified-nav-item">官公庁マスタ</a>
                </nav>
            </div>
            <div class="unified-header-tier2">
                <h1>決算期別一覧</h1>
            </div>
            <div class="unified-header-tier3">
                <button class="secondary-btn" id="btn-export-excel"
                    style="background: #ecfdf5; color: #065f46; border-color: #a7f3d0;">
                    <span style="margin-right: 4px;">📊</span> Excel出力
                </button>
                <button class="secondary-btn" id="btn-export-pdf"
                    style="background: #fff1f2; color: #9f1239; border-color: #fecdd3;">
                    <span style="margin-right: 4px;">📄</span> PDF出力
                </button>
            </div>
        </header>

        <!-- Filter Section -->
        <section class="filter-glass">
            <div class="filter-grid"
                style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 16px;">
                <div class="filter-group">
                    <label for="filter-license-type">許認可種別</label>
                    <select id="filter-license-type">
                        <option value="">すべて</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-fiscal-month">決算月</label>
                    <select id="filter-fiscal-month">
                        <option value="">すべて</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="filter-staff">外務担当者</label>
                    <select id="filter-staff">
                        <option value="">すべて</option>
                    </select>
                </div>
                <div class="filter-group search-box">
                    <label for="filter-remarks">備考検索 (顧客)</label>
                    <input type="text" id="filter-remarks" placeholder="備考の内容で検索...">
                </div>
            </div>
            <div style="margin-top: 16px; display: flex; justify-content: space-between; align-items: center;">
                <div id="count-display" style="font-size: 0.9rem; color: #64748b; font-weight: 600;">
                    表示件数：0件 / 全体：0件
                </div>
                <button class="secondary-btn" id="btn-reset-filters">リセット</button>
            </div>
        </section>

        <!-- List Table -->
        <section class="table-glass">
            <div id="initial-message"
                style="text-align: center; color: #94a3b8; padding: 50px 0; font-size: 1.1rem; border: 1px dashed #e2e8f0; border-radius: 8px; margin-bottom: 20px;">
                決算月を選択してください
            </div>
            <div class="table-wrapper" id="table-wrapper" style="display: none;">
                <table id="washout-table">
                    <thead>
                        <tr>
                            <th style="width: 25%;">顧客名(担当者)</th>
                            <th style="width: 8%;">決算</th>
                            <th style="width: 25%;">許認可（官公庁・番号）</th>
                            <th style="width: 10%;">満了日</th>
                            <th style="width: 27%;">顧客備考</th>
                        </tr>
                    </thead>
                    <tbody id="washout-list-body">
                        <!-- JSで動的に追加 -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 LAPIS2 Project</p>
        </footer>
    </main>

    <button id="back-to-top" class="back-to-top">↑</button>

    <!-- Print Template -->
    <div id="print-template-washout" style="display: none; padding: 40px; font-family: 'BIZ UDGothic', sans-serif;">
        <style>
            #print-template-washout table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 20px;
                table-layout: fixed;
                /* レイアウト崩れ防止 */
            }

            #print-template-washout th,
            #print-template-washout td {
                border: 1px solid #cbd5e1;
                padding: 10px;
                word-wrap: break-word;
                /* 長いテキストの折り返し */
                overflow-wrap: break-word;
            }

            #print-template-washout tr {
                page-break-inside: avoid;
                /* 行の途中での改ページを防止 */
            }

            #print-template-washout thead {
                display: table-header-group;
                /* 各ページにヘッダーを表示しようと試みる（ブラウザ依存あり） */
            }
        </style>
        <h1 style="text-align: center; color: #1e293b; margin-bottom: 5px;">決算期別一覧表</h1>
        <p style="text-align: right; color: #64748b; font-size: 0.9rem;">出力日時: <span id="p-print-now"></span></p>

        <div style="margin: 20px 0; padding: 15px; background: #f8fafc; border-radius: 8px; border: 1px solid #e2e8f0;">
            <p style="margin: 0; font-weight: 600;">対象: <span id="p-target-month"></span></p>
        </div>

        <table style="width: 100%; border-collapse: collapse; margin-top: 20px;">
            <thead>
                <tr style="background: #f1f5f9;">
                    <th
                        style="border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 0.9rem; width: 25%;">
                        顧客名(担当者)</th>
                    <th
                        style="border: 1px solid #cbd5e1; padding: 10px; text-align: center; font-size: 0.9rem; width: 8%;">
                        決算
                    </th>
                    <th
                        style="border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 0.9rem; width: 25%;">
                        許認可（官公庁・番号）</th>
                    <th
                        style="border: 1px solid #cbd5e1; padding: 10px; text-align: center; font-size: 0.9rem; width: 12%;">
                        満了日
                    </th>
                    <th
                        style="border: 1px solid #cbd5e1; padding: 10px; text-align: left; font-size: 0.9rem; width: 30%;">
                        顧客備考
                    </th>
                </tr>
            </thead>
            <tbody id="p-washout-body">
                <!-- JSで動的に追加 -->
            </tbody>
        </table>

        <div style="margin-top: 30px; text-align: right; font-size: 0.8rem; color: #94a3b8;">
            LAPIS2 Case Management System
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="license_washout.js"></script>
</body>

</html>
