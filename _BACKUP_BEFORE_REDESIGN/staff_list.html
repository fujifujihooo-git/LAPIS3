<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPIS2 - 担当者管理</title>
    <link rel="stylesheet" href="style_v2.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <main class="dashboard-container">
        <header class="unified-header">
            <div class="unified-header-tier1">
                <nav class="unified-nav">
                    <a href="index.html" class="unified-nav-item">案件管理</a>
                    <span class="nav-separator">|</span>
                    <a href="customer_list.html" class="unified-nav-item">顧客管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_list.html" class="unified-nav-item">許認可管理</a>
                    <span class="nav-separator">|</span>
                    <a href="invoice_list.html" class="unified-nav-item">請求管理</a>
                    <span class="nav-separator">|</span>
                    <a href="sales_list.html" class="unified-nav-item">売上管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_washout.html" class="unified-nav-item">決算期別</a>
                    <span class="nav-separator">|</span>
                    <a href="staff_list.html" class="unified-nav-item active">担当者管理</a>
                    <span class="nav-separator">|</span>
                    <a href="government_office_list.html" class="unified-nav-item">官公庁マスタ</a>
                </nav>
            </div>
            <div class="unified-header-tier2">
                <h1 id="page-title">担当者管理</h1>
            </div>
            <div class="unified-header-tier3">
                <button class="primary-btn" id="btn-new-staff">+ 新規担当者登録</button>
            </div>
        </header>

        <header class="dashboard-header" style="display: none;">
            <div class="brand">
                <h1>担当者管理</h1>
                <p class="subtitle">Staff Management</p>
            </div>
            <div class="header-actions">
                <nav class="main-nav">
                    <a href="staff_list.html" class="nav-item active">担当者管理</a>
                    <a href="government_office_list.html" class="nav-item">官公庁マスタ</a>
                </nav>
                <button class="primary-btn" id="btn-new-staff-old">
                    <span class="icon">＋</span> 新規担当者登録
                </button>
            </div>
        </header>

        <!-- Filter Section -->
        <section class="filter-glass">
            <div class="filter-group">
                <label for="filter-status">状態</label>
                <select id="filter-status">
                    <option value="在籍">在籍</option>
                    <option value="休職">休職</option>
                    <option value="退職">退職</option>
                    <option value="">すべて</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filter-role">役割</label>
                <select id="filter-role">
                    <option value="">すべて</option>
                    <option value="行政書士">行政書士</option>
                    <option value="補助者">補助者</option>
                    <option value="事務員">事務員</option>
                    <option value="その他">その他</option>
                </select>
            </div>
            <div class="filter-group search-box">
                <label for="search-name">担当者名</label>
                <input type="text" id="search-name" placeholder="名前またはフリガナで検索...">
            </div>
        </section>

        <!-- Staff List Table -->
        <section class="table-glass">
            <div class="table-wrapper">
                <table id="staff-table">
                    <thead>
                        <tr>
                            <th class="sortable" data-sort="staff_id" style="width: 60px;">ID</th>
                            <th class="sortable" data-sort="status">状態</th>
                            <th class="sortable" data-sort="staff_name">担当者名</th>
                            <th class="sortable" data-sort="department">所属部署</th>
                            <th class="sortable" data-sort="role">役割</th>
                            <th class="sortable" data-sort="email">メールアドレス</th>
                            <th class="sortable" data-sort="last_updated">最終更新</th>
                        </tr>
                    </thead>
                    <tbody id="staff-list-body">
                        <!-- JSで動的に追加 -->
                    </tbody>
                </table>
            </div>
        </section>

        <footer>
            <p>&copy; 2026 LAPIS2 Project</p>
        </footer>
    </main>

    <button id="back-to-top" class="back-to-top">↑</button>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="staff_list.js"></script>
</body>

</html>
