<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPIS2 - 拠点詳細</title>
    <link rel="stylesheet" href="style_v2.css?v=4">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        window.onerror = function (msg, url, line, col, error) {
            const el = document.getElementById('debug-log');
            if (el) el.innerHTML += `<span style="color:red">Global Error: ${msg} (Line: ${line})</span><br>`;
            return false;
        };
    </script>
</head>

<body>
    <div id="debug-log"
        style="position:fixed; top:0; left:0; width:100%; height:150px; background:rgba(0,0,0,0.85); color:#0f0; z-index:10000; overflow:auto; padding:10px; font-family:monospace; border-bottom: 2px solid #fff;">
        <strong>DEBUG CONSOLE</strong><br>
    </div>
    <main class="dashboard-container">
        <header class="unified-header">
            <div class="unified-header-tier1">
                <nav class="unified-nav">
                    <a href="index.html" class="unified-nav-item">案件管理</a>
                    <span class="nav-separator">|</span>
                    <a href="customer_list.html" class="unified-nav-item active">顧客管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_list.html" class="unified-nav-item">許認可管理</a>
                    <span class="nav-separator">|</span>
                    <a href="invoice_list.html" class="unified-nav-item">請求管理</a>
                    <span class="nav-separator">|</span>
                    <a href="sales_list.html" class="unified-nav-item">売上管理</a>
                    <span class="nav-separator">|</span>
                    <a href="license_washout.html" class="unified-nav-item">決算期別</a>
                    <span class="nav-separator">|</span>
                    <a href="staff_list.html" class="unified-nav-item">担当者管理</a>
                    <span class="nav-separator">|</span>
                    <a href="government_office_list.html" class="unified-nav-item">官公庁マスタ</a>
                </nav>
            </div>
            <div class="unified-header-tier2">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <h1 id="page-title">拠点詳細：-</h1>
                    <p id="office-id-display" style="font-size: 0.875rem; color: #64748b; margin: 0;">Office ID: -</p>
                </div>
            </div>
            <div class="unified-header-tier3">
                <button type="button" class="secondary-btn" id="btn-back">← 詳細に戻る</button>
                <button type="button" class="danger-btn" id="btn-delete">削除</button>
                <button type="submit" form="office-form" class="primary-btn">保存</button>
            </div>
        </header>

        <header class="dashboard-header" style="display: none;">
            <div class="brand">
                <h1 id="office-title-old">拠点詳細：-</h1>
                <p class="subtitle" id="office-id-display-old">Office ID: -</p>
            </div>
            <div class="header-actions">
                <nav class="main-nav">
                    <a href="index.html" class="nav-item">案件管理</a>
                    <a href="customer_list.html" class="nav-item active">顧客管理</a>
                    <a href="license_list.html" class="nav-item">許認可管理</a>
                    <a href="staff_list.html" class="nav-item">担当者管理</a>
                    <a href="government_office_list.html" class="nav-item">官公庁マスタ</a>
                </nav>
                <button class="secondary-btn" id="btn-back-top">一覧に戻る</button>
            </div>
        </header>

        <form id="office-form">
            <!-- ■ 基本情報 -->
            <section class="form-section">
                <h2>基本情報</h2>
                <div class="form-grid grid-2-col">
                    <div class="form-group">
                        <label for="office_name">拠点名 <span class="required">*</span></label>
                        <input type="text" id="office_name" required placeholder="例：東京本社、大阪営業所など">
                    </div>
                    <div class="form-group checkbox-group" style="margin-top: 32px;">
                        <input type="checkbox" id="is_main">
                        <label for="is_main">本社として設定</label>
                    </div>
                </div>
            </section>

            <!-- ■ 連絡先情報 -->
            <section class="form-section">
                <h2>連絡先情報</h2>
                <div class="form-grid grid-contact-row1 full-width" style="margin-bottom: 16px;">
                    <div class="form-group">
                        <label for="postal_code">郵便番号</label>
                        <div style="display: flex; gap: 8px;">
                            <input type="text" id="postal_code" placeholder="000-0000" style="flex: 1;">
                            <button type="button" class="lookup-btn" id="btn-lookup-zip"
                                style="padding: 0 12px; white-space: nowrap;">住所検索</button>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="address">住所</label>
                        <input type="text" id="address">
                    </div>
                    <div class="form-group">
                        <label for="building_name">建物名</label>
                        <input type="text" id="building_name">
                    </div>
                </div>
                <div class="form-grid grid-2-col full-width">
                    <div class="form-group">
                        <label for="phone">電話番号</label>
                        <input type="tel" id="phone">
                    </div>
                    <div class="form-group">
                        <label for="fax">FAX番号</label>
                        <input type="tel" id="fax">
                    </div>
                </div>
            </section>

            <!-- ■ 管理情報 -->
            <section class="form-section">
                <h2>管理情報</h2>
                <div class="form-grid">
                    <div class="form-group">
                        <label for="status">状態 <span class="required">*</span></label>
                        <select id="status" required>
                            <option value="有効">有効</option>
                            <option value="閉鎖">閉鎖</option>
                        </select>
                    </div>
                    <div class="form-group full-width">
                        <label for="remarks">備考</label>
                        <textarea id="remarks" placeholder="拠点に関する特記事項"></textarea>
                    </div>
                </div>
            </section>

            <div class="action-bar" style="display: none;">
                <button type="button" class="danger-btn" id="btn-delete-old" style="margin-right: auto;">削除する</button>
                <button type="button" class="secondary-btn" id="btn-back-old">キャンセル</button>
                <button type="submit" class="primary-btn">保存</button>
            </div>

            <p class="footer-info">登録日: <span id="created-date-display">-</span> | 最終更新日時: <span
                    id="last-updated-display">-</span></p>
        </form>

        <footer style="margin-top: 40px;">
            <p>&copy; 2026 LAPIS2 Project</p>
        </footer>
    </main>

    <button id="back-to-top" class="back-to-top">↑</button>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="office_detail.js?v=debug2"></script>
</body>

</html>
