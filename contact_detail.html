    <style>
        /* Local overrides for detail pages */

        /* ========================================
         * 13pt フォントサイズ統一
         * 対象: メインコンテンツエリア内の全テキスト要素
         * 対象外: サイドバー、フッター
         * ======================================== */
        #page-content .form-group label,
        #page-content .form-control,
        #page-content .form-select,
        #page-content textarea,
        #page-content .form-section-title,
        #page-content .btn,
        #page-content select option {
            font-size: 13pt !important;
        }

        .form-section-title {
            font-size: 13pt;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 13pt;
        }

        .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-control,
        .form-select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13pt;
            transition: all 0.2s;
            background: #fff;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            outline: none;
        }
    </style>
</head>

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <div class="header-breadcrumb">
                        <a href="customer_list.html" style="text-decoration: none; color: var(--text-muted);">顧客一覧</a>

                        <a href="#" id="customer-link" style="text-decoration: none; color: var(--text-muted);">顧客詳細</a>
                        <span style="margin: 0 8px; color: var(--text-muted);">/</span>
                        <span id="page-title">連絡先詳細</span>
                    </div>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Actions Bar -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <h2 style="margin: 0; font-size: 1.5rem; color: var(--text-main);">連絡先情報編集</h2>
                        <span id="header-contact-name"
                            style="font-size: 1.1rem; color: var(--text-muted); font-weight: 500;">-</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-secondary" id="btn-back">
                            顧客詳細へ
                        </button>
                        <button type="button" class="btn btn-danger-outline" id="btn-delete" style="display: none;">
                            <span>🗑️</span> 削除
                        </button>
                        <button type="button" class="btn btn-primary" id="btn-save">
                            <span>💾</span> 保存
                        </button>
                    </div>
                </div>

                <form id="contact-form">
                    <div class="block">
                        <div class="block-content">
                            <!-- Basic Info -->
                            <h3 class="form-section-title">連絡先情報</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="contact_name">氏名 <span class="required">*</span></label>
                                    <input type="text" id="contact_name" class="form-control" placeholder="例: 山田 花子">
                                </div>
                                <div class="form-group">
                                    <label for="contact_kana">フリガナ</label>
                                    <input type="text" id="contact_kana" class="form-control" placeholder="例: ヤマダ ハナコ">
                                </div>
                            </div>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="department">部署</label>
                                    <input type="text" id="department" class="form-control" placeholder="例: 総務部">
                                </div>
                                <div class="form-group">
                                    <label for="title">役職</label>
                                    <input type="text" id="title" class="form-control" placeholder="例: 部長">
                                </div>
                                <div class="form-group">
                                    <label for="office_id">所属拠点</label>
                                    <select id="office_id" class="form-select">
                                        <option value="">(未選択)</option>
                                        <!-- JS generated -->
                                    </select>
                                </div>
                            </div>
                            <div class="form-group" style="margin-top: 8px;">
                                <label style="display: inline-flex; align-items: center; gap: 8px; cursor: pointer;">
                                    <input type="checkbox" id="is_primary" style="width: auto;">
                                    主担当者に設定する
                                </label>
                            </div>

                            <!-- Contact Info -->
                            <h3 class="form-section-title" style="margin-top: 32px;">連絡先</h3>
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="phone">電話番号</label>
                                    <input type="tel" id="phone" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label for="mobile">携帯番号</label>
                                    <input type="tel" id="mobile" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label for="email">メールアドレス</label>
                                    <input type="email" id="email" class="form-control">
                                </div>
                            </div>
                            <div class="form-grid" style="grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));">
                                <div class="form-group">
                                    <label for="fax">FAX番号</label>
                                    <input type="tel" id="fax" class="form-control">
                                </div>
                            </div>

                            <div class="form-group" style="margin-top: 24px;">
                                <label for="status">状態</label>
                                <select id="status" class="form-select" style="max-width: 200px;">
                                    <option value="在籍">在籍</option>
                                    <option value="退職">退職</option>
                                    <option value="異動">異動</option>
                                </select>
                            </div>

                            <div class="form-group" style="margin-top: 24px;">
                                <label for="remarks">備考</label>
                                <textarea id="remarks" class="form-control" rows="4" placeholder="備考..."></textarea>
                            </div>
                        </div>
                    </div>
                </form>
