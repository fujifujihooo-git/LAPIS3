<head>

    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <!-- UnifiedDatePicker -->
    <script src="unified_datepicker.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* ================================================
           Filter Grid System — 4col × 2row
           ================================================ */
        .filter-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px 16px;
        }

        .filter-grid .filter-cell {
            display: flex;
            flex-direction: column;
        }

        .filter-grid .filter-cell label {
            font-size: 13pt !important;
            font-weight: 500;
            margin-bottom: 4px;
            color: var(--text-secondary, #555);
        }

        .filter-grid .filter-cell .form-select,
        .filter-grid .filter-cell .form-control {
            font-size: 13pt !important;
            width: 100%;
        }

        /* 申請期限チェックボックス — 顧客名セル内に統合 */
        .filter-deadline-inline {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 6px;
        }

        .filter-deadline-inline input[type="checkbox"] {
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .filter-deadline-inline label {
            font-size: 11pt !important;
            font-weight: 400 !important;
            margin: 0 !important;
            cursor: pointer;
            color: var(--text-muted, #888) !important;
        }

        /* 期間 From / To ラベル付き */
        .filter-date-label-inline {
            font-size: 10pt !important;
            color: var(--text-muted, #888) !important;
            font-weight: 400 !important;
            margin-bottom: 2px !important;
        }

        /* ボタンセル — 下揃え + 右寄せ */
        .filter-cell-actions {
            display: flex;
            align-items: flex-end;
            justify-content: flex-end;
            gap: 8px;
        }

        .filter-cell-actions .btn {
            white-space: nowrap;
            height: 40px;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* テーブル・ブロック 13pt */
        .block-content,
        .table-modern,
        .table-modern th {
            font-size: 13pt !important;
        }

        .btn-search,
        .btn-reset {
            font-size: 13pt !important;
        }

        /* Responsive: 4 → 2 → 1 column */
        @media (max-width: 1024px) {
            .filter-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 600px) {
            .filter-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">

                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html" class="active">

                </li>

                    <a href="sales_list.html">

                </li>

                <li class="nav-header">Settings</li>

                <li class="nav-item">

                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">

        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <h1 class="page-title">案件管理ダッシュボード</h1>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status will be injected here by common.js -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Stats Grid -->
                <!-- Use IDs: stat-total, stat-active, stat-ready, stat-completed for JS compat -->
                <div class="stats-grid">
                    <div class="stat-card-modern stat-total" id="card-total">
                        <div class="stat-info">
                            <div class="stat-label">業務概況</div>
                            <div class="stat-number"><span id="stat-active">0</span> <span
                                    style="font-size: 1rem; color: #999; font-weight:400;">/ <span
                                        id="stat-total">0</span></span></div>
                        </div>
                        <div class="stat-icon-wrapper">
                            📊
                        </div>
                    </div>

                    <div class="stat-card-modern stat-urgent" id="card-urgent">
                        <div class="stat-info">
                            <div class="stat-label">至急対応</div>
                            <div class="stat-number" id="stat-urgent">0</div>
                        </div>
                        <div class="stat-icon-wrapper">
                            🔔
                        </div>
                    </div>

                    <div class="stat-card-modern stat-ready" id="card-ready">
                        <div class="stat-info">
                            <div class="stat-label">申請準備完了</div>
                            <div class="stat-number" id="stat-ready">0</div>
                        </div>
                        <div class="stat-icon-wrapper">
                            📝
                        </div>
                    </div>
                </div>

                <!-- Filters & Action Bar -->
                <div class="block">
                    <div class="block-header">
                        <h3 class="block-title">検索フィルタ</h3>
                    </div>
                    <div class="block-content">

                        <!-- ===== 4-Column Filter Grid ===== -->
                        <div class="filter-grid">
                            <!-- Row 1 -->
                            <div class="filter-cell">
                                <label for="filter-status">ステータス</label>
                                <select id="filter-status" class="form-select">
                                    <option value="">すべて（仕掛中）</option>
                                    <option value="相談">相談</option>
                                    <option value="受任">受任</option>
                                    <option value="作成中">作成中</option>
                                    <option value="申請準備完了">申請準備完了</option>
                                    <option value="受付（受理）">受付（受理）</option>
                                    <option value="補正対応中">補正対応中</option>
                                    <option value="完了">完了</option>
                                    <option value="返却済">返却済</option>
                                    <option value="取下げ">取下げ</option>
                                </select>
                            </div>
                            <div class="filter-cell">
                                <label for="filter-license">許認可種別</label>
                                <select id="filter-license" class="form-select">
                                    <option value="">すべて</option>
                                </select>
                            </div>
                            <div class="filter-cell">
                                <label for="filter-staff">担当者</label>
                                <select id="filter-staff" class="form-select">
                                    <option value="">すべて</option>
                                </select>
                            </div>
                            <div class="filter-cell">
                                <label for="filter-customer">顧客名</label>
                                <input type="text" id="filter-customer" class="form-control" placeholder="顧客名で検索...">
                                <div class="filter-deadline-inline">
                                    <input type="checkbox" id="filter-deadline-near">
                                    <label for="filter-deadline-near">申請期限が近い</label>
                                </div>
                            </div>

                            <!-- Row 2 -->
                            <div class="filter-cell">
                                <label for="filter-date-type">日付種別</label>
                                <select id="filter-date-type" class="form-select">
                                    <option value="">指定なし</option>
                                    <option value="contract_date">受任日</option>
                                    <option value="application_scheduled_date">申請予定日</option>
                                    <option value="acceptance_date">受付日</option>
                                    <option value="completion_date">完了日</option>
                                    <option value="return_date">返却日</option>
                                </select>
                            </div>
                            <div class="filter-cell">
                                <label class="filter-date-label-inline">開始日</label>
                                <input type="date" id="filter-date-start" class="form-control">
                            </div>
                            <div class="filter-cell">
                                <label class="filter-date-label-inline">終了日</label>
                                <input type="date" id="filter-date-end" class="form-control">
                            </div>
                            <div class="filter-cell filter-cell-actions">
                                <button class="btn btn-reset" id="btn-reset-filters">
                                    <i data-lucide="rotate-ccw"></i> リセット
                                </button>
                                <button id="btn-search-execute" class="btn btn-search">
                                    <i data-lucide="search"></i> 検索
                                </button>
                            </div>
                        </div>
                        <!-- ===== END Filter Grid ===== -->

                    </div>
                </div>

                <!-- Case Table -->
                <div class="block">
                    <!-- <div class="block-header">
                        <h3 class="block-title">案件一覧</h3>
                    </div> -->
                    <div class="block-content" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="table-modern" id="case-table">
                                <thead>
                                    <tr>
                                        <th class="sortable" data-sort="status">ステータス <span class="sort-icon"></span>
                                        </th>
                                        <th class="sortable" data-sort="contract_date">受任日 <span
                                                class="sort-icon"></span></th>
                                        <th>顧客名</th>
                                        <th>業務内容</th>
                                        <th class="sortable" data-sort="remaining_days">残り日数 <span
                                                class="sort-icon"></span></th>
                                        <th>担当者</th>
                                    </tr>
                                </thead>
                                <tbody id="case-list-body">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>


                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>

            </main>
            <!-- END Page Content -->
        </div>
