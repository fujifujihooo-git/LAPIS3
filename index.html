<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>案件管理 - LAPIS2</title>
    <meta name="description" content="NAS上で動作する次世代Webアプリケーション LAPIS2">
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Temporary localized overrides if needed */
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">
                    <span style="color: var(--primary);">✦</span> LAPIS2
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html" class="active">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">案件管理</span>
                    </a>
                </li>

                <li class="nav-header">Management</li>
                <li class="nav-item">
                    <a href="customer_list.html">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">顧客管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_list.html">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">許認可管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="invoice_list.html">
                        <span class="nav-icon">💰</span>
                        <span class="nav-label">請求管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales_list.html">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">売上管理</span>
                    </a>
                </li>

                <li class="nav-header">Settings</li>
                <li class="nav-item">
                    <a href="license_washout.html">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">決算期別一覧</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="staff_list.html">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">担当者管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">
                        <span class="nav-icon">🏛️</span>
                        <span class="nav-label">官公庁マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_types_list.html">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">許認可マスタ</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <h1 class="page-title">案件管理ダッシュボード</h1>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status will be injected here by common.js -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Stats Grid -->
                <!-- Use IDs: stat-total, stat-active, stat-ready, stat-completed for JS compat -->
                <div class="stats-grid">
                    <div class="stat-card-modern stat-total" id="card-total">
                        <div class="stat-info">
                            <div class="stat-label">業務概況</div>
                            <div class="stat-number"><span id="stat-active">0</span> <span
                                    style="font-size: 1rem; color: #999; font-weight:400;">/ <span
                                        id="stat-total">0</span></span></div>
                        </div>
                        <div class="stat-icon-wrapper">
                            📊
                        </div>
                    </div>

                    <div class="stat-card-modern stat-urgent" id="card-urgent">
                        <div class="stat-info">
                            <div class="stat-label">至急対応</div>
                            <div class="stat-number" id="stat-urgent">0</div>
                        </div>
                        <div class="stat-icon-wrapper">
                            🔔
                        </div>
                    </div>

                    <div class="stat-card-modern stat-ready" id="card-ready">
                        <div class="stat-info">
                            <div class="stat-label">申請準備完了</div>
                            <div class="stat-number" id="stat-ready">0</div>
                        </div>
                        <div class="stat-icon-wrapper">
                            📝
                        </div>
                    </div>
                </div>

                <!-- Filters & Action Bar -->
                <div class="block">
                    <div class="block-header">
                        <h3 class="block-title">検索フィルタ</h3>
                        <div class="block-options">
                            <button class="btn btn-reset" id="btn-reset-filters"><i data-lucide="rotate-ccw"></i>
                                リセット</button>
                        </div>
                    </div>
                    <div class="block-content">
                        <div class="filter-bar">
                            <div class="filter-item">
                                <label for="filter-status">ステータス</label>
                                <select id="filter-status" class="form-select">
                                    <option value="">すべて（仕掛中）</option>
                                    <option value="相談">相談</option>
                                    <option value="受任">受任</option>
                                    <option value="作成中">作成中</option>
                                    <option value="申請準備完了">申請準備完了</option>
                                    <option value="受付（受理）">受付（受理）</option>
                                    <option value="補正対応中">補正対応中</option>
                                    <option value="完了">完了</option>
                                    <option value="返却済">返却済</option>
                                    <option value="取下げ">取下げ</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label for="filter-license">許認可種別</label>
                                <select id="filter-license" class="form-select">
                                    <option value="">すべて</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label for="filter-staff">担当者</label>
                                <select id="filter-staff" class="form-select">
                                    <option value="">すべて</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label for="filter-customer">顧客名</label>
                                <input type="text" id="filter-customer" class="form-control" placeholder="顧客名で検索...">
                            </div>
                            <div class="filter-item" style="padding-bottom: 2px;">
                                <div style="display: flex; align-items: center; gap: 8px; margin-bottom: 12px;">
                                    <input type="checkbox" id="filter-deadline-near" style="width: 18px; height: 18px;">
                                    <label for="filter-deadline-near" style="margin:0; cursor:pointer;">申請期限が近い</label>
                                </div>
                                <button id="btn-search-execute" class="btn btn-search" style="width: 100%;">
                                    <i data-lucide="search"></i> 検索を実行
                                </button>
                            </div>
                        </div>

                        <!-- Import/Export Actions -->
                        <div
                            style="margin-top: 20px; border-top: 1px dashed #eee; padding-top: 16px; display: flex; justify-content: flex-end; gap: 10px;">
                            <button id="btn-export-top" class="btn btn-sm btn-secondary">📤 エクスポート</button>
                            <button id="btn-import-trigger-top" class="btn btn-sm btn-secondary">📥 インポート</button>
                            <input type="file" id="input-import-top" accept=".json" style="display: none;">
                        </div>
                    </div>
                </div>

                <!-- Case Table -->
                <div class="block">
                    <!-- <div class="block-header">
                        <h3 class="block-title">案件一覧</h3>
                    </div> -->
                    <div class="block-content" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="table-modern" id="case-table">
                                <thead>
                                    <tr>
                                        <th class="sortable" data-sort="status">ステータス <span class="sort-icon"></span>
                                        </th>
                                        <th class="sortable" data-sort="contract_date">受任日 <span
                                                class="sort-icon"></span></th>
                                        <th>顧客名</th>
                                        <th>業務内容</th>
                                        <th class="sortable" data-sort="remaining_days">残り日数 <span
                                                class="sort-icon"></span></th>
                                        <th>担当者</th>
                                    </tr>
                                </thead>
                                <tbody id="case-list-body">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <!-- Data Cleanup / Footer Actions -->
                <div style="text-align: right; margin-top: 40px; border-top: 1px solid #e6e6e6; padding-top: 20px;">
                    <h4 style="font-size: 0.9rem; color: #999; margin-bottom: 10px;">Advanced Options</h4>
                    <button class="btn btn-sm btn-secondary" id="btn-export-bottom" style="opacity: 0.6;">Backup Data
                        (JSON)</button>
                    <button class="btn btn-sm btn-secondary" id="btn-import-trigger-bottom"
                        style="opacity: 0.6;">Restore Data (JSON)</button>
                    <input type="file" id="input-import-bottom" accept=".json" style="display: none;">
                    <button class="btn btn-sm btn-danger" id="btn-delete-all"
                        style="display: none; margin-left: 10px;">Delete All</button>
                </div>

                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>

            </main>
            <!-- END Page Content -->
        </div>
        <!-- END Main Container -->

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
    </div>

    <!-- Back to top -->
    <button id="back-to-top" class="back-to-top" style="
        position: fixed; right: 20px; bottom: 20px; 
        width: 40px; height: 40px; border-radius: 50%; 
        background: var(--primary); color: #fff; border: none; 
        font-size: 1.2rem; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.3s;
        z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    ">↑</button>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="app.js"></script>


</body>

</html>
