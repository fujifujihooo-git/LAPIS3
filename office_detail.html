<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>拠点詳細 - LAPIS2</title>
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Local overrides for detail pages */

        /* ========================================
         * 13pt フォントサイズ統一
         * 対象: メインコンテンツエリア内の全テキスト要素
         * 対象外: サイドバー、フッター
         * ======================================== */
        #page-content .form-group label,
        #page-content .form-control,
        #page-content .form-select,
        #page-content textarea,
        #page-content .form-section-title,
        #page-content .btn,
        #page-content select option {
            font-size: 13pt !important;
        }

        .form-section-title {
            font-size: 13pt;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 13pt;
        }

        .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-control,
        .form-select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13pt;
            transition: all 0.2s;
            background: #fff;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            outline: none;
        }
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">
                    <span style="color: var(--primary);">✦</span> LAPIS2
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">案件管理</span>
                    </a>
                </li>

                <li class="nav-header">Management</li>
                <li class="nav-item">
                    <a href="customer_list.html" class="active">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">顧客管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_list.html">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">許認可管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="invoice_list.html">
                        <span class="nav-icon">💰</span>
                        <span class="nav-label">請求管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales_list.html">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">売上管理</span>
                    </a>
                </li>

                <li class="nav-header">Settings</li>
                <li class="nav-item">
                    <a href="license_washout.html">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">決算期別一覧</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="staff_list.html">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">担当者管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">
                        <span class="nav-icon">🏛️</span>
                        <span class="nav-label">官公庁マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_types_list.html">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">許認可マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="backup.html">
                        <span class="nav-icon">💾</span>
                        <span class="nav-label">バックアップ管理</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <div class="header-breadcrumb">
                        <a href="customer_list.html" style="text-decoration: none; color: var(--text-muted);">顧客一覧</a>
                        <span style="margin: 0 8px; color: var(--text-muted);">/</span>
                        <a href="#" id="customer-link" style="text-decoration: none; color: var(--text-muted);">顧客詳細</a>
                        <span style="margin: 0 8px; color: var(--text-muted);">/</span>
                        <span id="page-title">拠点詳細</span>
                    </div>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Actions Bar -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <h2 style="margin: 0; font-size: 1.5rem; color: var(--text-main);">拠点情報編集</h2>
                        <span id="header-office-name"
                            style="font-size: 1.1rem; color: var(--text-muted); font-weight: 500;">-</span>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-secondary" id="btn-back">
                            顧客詳細へ
                        </button>
                        <button type="button" class="btn btn-danger-outline" id="btn-delete" style="display: none;">
                            <span>🗑️</span> 削除
                        </button>
                        <button type="button" class="btn btn-primary" id="btn-save">
                            <span>💾</span> 保存
                        </button>
                    </div>
                </div>

                <form id="office-form">
                    <div class="block">
                        <div class="block-content">
                            <!-- Basic Info -->
                            <h3 class="form-section-title">拠点情報</h3>
                            <div class="form-grid">
                                <div class="form-group" style="grid-column: span 2;">
                                    <label for="office_name">拠点名 <span class="required">*</span></label>
                                    <input type="text" id="office_name" class="form-control" placeholder="例: 本店、○○営業所">
                                </div>
                            </div>

                            <!-- Address -->
                            <h3 class="form-section-title" style="margin-top: 32px;">住所・連絡先</h3>
                            <!-- Unified Linear Flow (Postal -> Search -> Address -> Building) -->
                            <div
                                style="display: flex; gap: 16px; align-items: flex-end; margin-bottom: 20px; flex-wrap: wrap;">
                                <!-- Postal Group -->
                                <div class="form-group" style="margin-bottom: 0;">
                                    <label for="postal_code">郵便番号</label>
                                    <div style="display: flex; gap: 8px;">
                                        <input type="text" id="postal_code" class="form-control" placeholder="123-4567"
                                            maxlength="8" style="width: 140px; flex: 0 0 140px;">
                                        <button type="button" class="btn btn-secondary btn-sm" id="btn-lookup-zip"
                                            style="white-space: nowrap;">検索</button>
                                    </div>
                                </div>
                                <!-- Address -->
                                <div class="form-group" style="flex: 1; min-width: 300px; margin-bottom: 0;">
                                    <label for="address">住所 <span class="required">*</span></label>
                                    <input type="text" id="address" class="form-control">
                                </div>
                                <!-- Building -->
                                <div class="form-group" style="width: 328px; flex: 0 0 328px; margin-bottom: 0;">
                                    <label for="building_name">建物名</label>
                                    <input type="text" id="building_name" class="form-control">
                                </div>
                            </div>

                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="phone">電話番号</label>
                                    <input type="tel" id="phone" class="form-control">
                                </div>
                                <div class="form-group">
                                    <label for="fax">FAX番号</label>
                                    <input type="tel" id="fax" class="form-control">
                                </div>
                            </div>

                            <div class="form-group" style="margin-top: 24px;">
                                <label for="status">状態</label>
                                <select id="status" class="form-select" style="max-width: 200px;">
                                    <option value="active">有効</option>
                                    <option value="inactive">無効</option>
                                </select>
                            </div>

                            <div class="form-group" style="margin-top: 24px;">
                                <label for="remarks">備考</label>
                                <textarea id="remarks" class="form-control" rows="4" placeholder="備考..."></textarea>
                            </div>
                        </div>
                    </div>
                </form>

                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>
            </main>
        </div>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="office_detail.js"></script>
</body>

</html>
