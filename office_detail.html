    <style>
        /* Local overrides for detail pages */

        /* ========================================
         * 13pt フォントサイズ統一
         * 対象: メインコンテンツエリア内の全テキスト要素
         * 対象外: サイドバー、フッター
         * ======================================== */
        #page-content .form-group label,
        #page-content .form-control,
        #page-content .form-select,
        #page-content textarea,
        #page-content .form-section-title,
        #page-content .btn,
        #page-content select option {
            font-size: 13pt !important;
        }

        .form-section-title {
            font-size: 13pt;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 13pt;
        }

        .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-control,
        .form-select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 13pt;
            transition: all 0.2s;
            background: #fff;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59,130,246,.12);
            outline: none;
        }

        /* --- Section Card --- */
        .form-section-card {
            background: #fff;
            border: 1px solid #e8edf3;
            border-radius: 14px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 1px 2px rgba(0,0,0,.04);
        }
        .form-section-card .form-section-title {
            margin-top: 0;
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 24px;
        }

        /* --- Radio Cards --- */
        .radio-cards-group {
            display: flex;
            gap: 16px;
        }
        .radio-card {
            position: relative;
            cursor: pointer;
            flex: 1;
            max-width: 400px;
        }
        .radio-card input {
            position: absolute;
            opacity: 0;
            cursor: pointer;
        }
        .radio-card-content {
            display: flex;
            align-items: flex-start;
            gap: 12px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            border-radius: 12px;
            background: #fff;
            transition: all 0.15s ease;
        }
        .radio-card input:checked + .radio-card-content {
            border-color: #3b82f6;
            background: #f0f9ff;
        }
        .radio-card-icon {
            font-size: 24px;
            line-height: 1;
        }
        .radio-card-title {
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 4px;
            font-size: 11pt;
        }
        .radio-card-desc {
            font-size: 9.5pt;
            color: var(--text-muted);
        }
    </style>
</head>

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">

                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <div class="header-breadcrumb">

                        <a href="#" id="customer-link" style="text-decoration: none; color: var(--text-muted);">顧客詳細</a>
                        <span style="margin: 0 8px; color: var(--text-muted);">/</span>
                        <span id="page-title">拠点詳細</span>
                    </div>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>

            <!-- Page Content -->
            <main id="page-content">

                <!-- Title Header (No Buttons Here) -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <h2 style="margin: 0; font-size: 1.5rem; color: var(--text-main);">拠点情報編集</h2>
                        <span id="header-office-name"
                            style="font-size: 1.1rem; color: var(--text-muted); font-weight: 500;">-</span>
                    </div>
                </div>

                <form id="office-form" style="padding-bottom: 80px;">
                    <!-- セクション1：基本情報 -->
                    <div class="form-section-card">
                        <h3 class="form-section-title">基本情報</h3>
                        <div style="display: flex; flex-direction: column; gap: 12px;">
                            <div class="form-grid" style="margin-bottom: 0;">
                                <div class="form-group" style="grid-column: span 2;">
                                    <label for="office_name">拠点名 <span class="required">*</span></label>
                                    <input type="text" id="office_name" class="form-control" placeholder="例: 品川営業所">
                                </div>
                                <div class="form-group">
                                    <label for="status">状態 <span class="required">*</span></label>
                                    <select id="status" class="form-select">
                                        <option value="稼働中">稼働中</option>
                                        <option value="休止">休止</option>
                                        <option value="閉鎖">閉鎖</option>
                                        <option value="仮登録">仮登録</option>
                                    </select>
                                </div>
                            </div>
                            
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="postal_code">郵便番号</label>
                                <div style="position: relative; width: 140px;">
                                    <input type="text" id="postal_code" class="form-control" placeholder="123-4567"
                                        maxlength="8" style="padding-right: 36px;" data-validate="zip">
                                    <button type="button" id="btn-lookup-zip"
                                        style="position: absolute; right: 4px; top: 50%; transform: translateY(-50%); width: 28px; height: 28px; background: transparent; border: none; cursor: pointer; color: #64748b; display: flex; align-items: center; justify-content: center; font-size: 14px; padding: 0;" title="検索">🔍</button>
                                </div>
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="address">住所 <span class="required">*</span></label>
                                <input type="text" id="address" class="form-control" style="max-width: 600px;">
                            </div>
                            <div class="form-group" style="margin-bottom: 0;">
                                <label for="building_name">建物名</label>
                                <input type="text" id="building_name" class="form-control" style="max-width: 600px;">
                            </div>
                        </div>
                    </div>

                    <!-- セクション2：連絡先・法的位置づけ -->
                    <div class="form-section-card">
                        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 24px;">
                            <!-- 左カラム：連絡先・備考 -->
                            <div>
                                <h3 class="form-section-title">連絡先</h3>
                                <div style="display: flex; flex-direction: column; gap: 12px;">
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <label for="phone">電話番号</label>
                                        <input type="tel" id="phone" class="form-control" data-validate="tel">
                                    </div>
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <label for="fax">FAX番号</label>
                                        <input type="tel" id="fax" class="form-control" data-validate="tel">
                                    </div>
                                    <div class="form-group" style="margin-bottom: 0;">
                                        <label for="email">メールアドレス</label>
                                        <input type="email" id="email" class="form-control" data-validate="email">
                                    </div>
                                    <div class="form-group" style="margin-top: 8px; margin-bottom: 0;">
                                        <label for="remarks">備考</label>
                                        <textarea id="remarks" class="form-control" rows="3" placeholder="備考..."></textarea>
                                    </div>
                                </div>
                            </div>
                            <!-- 右カラム：法的位置づけ -->
                            <div>
                                <h3 class="form-section-title">法的位置づけ</h3>
                                <div style="display: flex; flex-direction: column; gap: 12px;">
                                    <label class="radio-card" style="max-width: 100%;">
                                        <input type="radio" name="registry_type" value="normal" checked>
                                        <div class="radio-card-content">
                                            <div class="radio-card-text">
                                                <div class="radio-card-title">通常拠点</div>
                                            </div>
                                        </div>
                                    </label>
                                    <label class="radio-card" style="max-width: 100%;">
                                        <input type="radio" name="registry_type" value="registered">
                                        <div class="radio-card-content">
                                            <div class="radio-card-text">
                                                <div class="radio-card-title">登記上所在地</div>
                                                <div class="radio-card-desc">※顧客全体で1件のみ</div>
                                            </div>
                                        </div>
                                    </label>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- フローティング保存バー -->
                    <div style="position: fixed; bottom: 0; left: 240px; right: 0; background: #fff; border-top: 1px solid #e5e7eb; padding: 16px 24px; display: flex; justify-content: flex-end; gap: 12px; z-index: 100; box-shadow: 0 -2px 8px rgba(0,0,0,.05);">
                        <button type="button" class="btn btn-danger-outline" id="btn-delete" style="display: none; margin-right: auto;">
                            <span>🗑️</span> 削除
                        </button>
                        <button type="button" class="btn btn-secondary" id="btn-back">
                            キャンセル
                        </button>
                        <button type="button" class="btn btn-primary" id="btn-save">
                            <span>💾</span> 保存
                        </button>
                    </div>

                </footer>
