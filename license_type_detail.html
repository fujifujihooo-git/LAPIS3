<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>許認可種別詳細 - LAPIS2</title>
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Local overrides for detail pages */
        .form-section-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 20px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-main);
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
            font-size: 0.9rem;
        }

        .required {
            color: #ef4444;
            margin-left: 4px;
        }

        .form-control,
        .form-select,
        textarea {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border-color);
            border-radius: 6px;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: #fff;
        }

        .form-control:focus,
        .form-select:focus,
        textarea:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--primary-light);
            outline: none;
        }

        /* User requested 13pt font for the form section */
        .block-content .form-section-title,
        .block-content .form-group label,
        .block-content .form-control,
        .block-content .form-select,
        .block-content textarea {
            font-size: 13pt !important;
        }
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">
                    <span style="color: var(--primary);">✦</span> LAPIS2
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">案件管理</span>
                    </a>
                </li>

                <li class="nav-header">Management</li>
                <li class="nav-item">
                    <a href="customer_list.html">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">顧客管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_list.html">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">許認可管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="invoice_list.html">
                        <span class="nav-icon">💰</span>
                        <span class="nav-label">請求管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales_list.html">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">売上管理</span>
                    </a>
                </li>

                <li class="nav-header">Settings</li>
                <li class="nav-item">
                    <a href="license_washout.html">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">決算期別一覧</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="staff_list.html">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">担当者管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">
                        <span class="nav-icon">🏛️</span>
                        <span class="nav-label">官公庁マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_types_list.html" class="active">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">許認可マスタ</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <h1 class="page-title">許認可種別詳細</h1>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Actions Bar -->
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <!-- Left: Back Button + Title -->
                    <div style="display: flex; align-items: center; gap: 12px;">
                        <button type="button" class="btn btn-secondary" id="btn-back">
                            <span>←</span> 一覧へ
                        </button>
                        <h2 style="margin: 0; font-size: 1.5rem; color: var(--text-main);">許認可種別詳細</h2>
                    </div>

                    <!-- Right: Delete, Save Buttons -->
                    <div class="d-flex gap-2">
                        <button type="button" class="btn btn-danger-outline" id="btn-delete" style="display: none;">
                            <span>🗑️</span> 削除
                        </button>
                        <button type="button" class="btn btn-primary" id="btn-save">
                            <span>💾</span> 保存
                        </button>
                    </div>
                </div>

                <div class="block">
                    <div class="block-content">
                        <!-- Basic Info -->
                        <h3 class="form-section-title">基本情報</h3>
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="license-type-id">ID <span
                                        style="font-size: 0.8em; color: #888;">(自動採番)</span></label>
                                <input type="text" id="license-type-id" class="form-control" readonly
                                    style="background-color: #f5f5f5; cursor: not-allowed;">
                            </div>
                            <div class="form-group" style="grid-column: span 2;">
                                <label for="license-type-name">種別名 <span class="required">*</span></label>
                                <input type="text" id="license-type-name" class="form-control" placeholder="例: 建設業許可">
                            </div>
                        </div>

                        <div class="form-grid">
                            <div class="form-group">
                                <label for="sort-order">表示順</label>
                                <input type="number" id="sort-order" class="form-control" value="0">
                            </div>
                            <div class="form-group">
                                <label for="category">カテゴリ</label>
                                <input type="text" id="category" class="form-control" placeholder="例: 建設関連">
                            </div>
                        </div>

                        <!-- Defaults -->
                        <h3 class="form-section-title" style="margin-top: 32px;">期限・案内設定</h3>

                        <div class="form-group" style="margin-bottom: 20px;">
                            <label style="display: flex; align-items: center; cursor: pointer;">
                                <input type="checkbox" id="has-expiry"
                                    style="width: 18px; height: 18px; margin-right: 8px;">
                                <span style="font-weight: 500;">有効期限あり</span>
                            </label>
                        </div>

                        <div id="notice-days-group">
                            <div class="form-grid">
                                <div class="form-group">
                                    <label for="default-notice-days">デフォルト案内時期(日前)</label>
                                    <input type="number" id="default-notice-days" class="form-control" value="90">
                                </div>
                                <div class="form-group">
                                    <!-- Placeholder for term years if we want to add it later, JS doesn't support it fully yet -->
                                </div>
                            </div>
                        </div>

                        <div class="form-group" style="margin-top: 24px;">
                            <label for="remarks">備考</label>
                            <textarea id="remarks" class="form-control" rows="3"></textarea>
                        </div>

                        <div class="form-group" style="margin-top: 24px;">
                            <label for="status">状態</label>
                            <select id="status" class="form-select">
                                <option value="active" selected>有効</option>
                                <option value="inactive">無効</option>
                            </select>
                        </div>

                        <div style="text-align: right; margin-top: 20px; color: var(--text-muted); font-size: 0.8rem;">
                            <p>登録日: <span id="created-date">-</span></p>
                            <p>最終更新日: <span id="last-updated">-</span></p>
                        </div>
                    </div>
                </div>

                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>
            </main>
        </div>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="license_type_detail.js"></script>
</body>

</html>
