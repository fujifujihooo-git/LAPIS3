<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>LAPIS2 - Data Migration</title>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <style>
        body {
            font-family: sans-serif;
            padding: 40px;
            line-height: 1.6;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }

        #log {
            background: #f4f4f4;
            padding: 10px;
            border-radius: 4px;
            border: 1px solid #ddd;
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>

<body>
    <h1>LAPIS2 データ移行ツール</h1>
    <p>ブラウザの <code>localStorage</code> に保存されているデータを Firebase Firestore へアップロードします。</p>
    <button id="btn-migrate">移行を開始する</button>

    <div id="status"></div>
    <div id="log"></div>

    <script>
        const btn = document.getElementById('btn-migrate');
        const status = document.getElementById('status');
        const logArea = document.getElementById('log');

        function addLog(msg, type = '') {
            const div = document.createElement('div');
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            if (type) div.className = type;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        btn.addEventListener('click', async () => {
            btn.disabled = true;
            status.textContent = '移行実行中... ページを閉じないでください。';
            addLog('移行プロセスを開始しました。');

            const keys = [
                'lapis2_staff',
                'lapis2_cases',
                'lapis2_customers',
                'lapis2_license_types',
                'lapis2_customer_licenses',
                'lapis2_license_history',
                'lapis2_invoices',
                'lapis2_invoice_items',
                'lapis2_payments',
                'lapis2_government_offices'
            ];

            try {
                for (const key of keys) {
                    const data = JSON.parse(localStorage.getItem(key) || '[]');
                    const collectionName = key.replace('lapis2_', '');
                    addLog(`${collectionName} のデータを処理中... (${data.length}件)`);

                    let maxId = 0;

                    for (const item of data) {
                        // IDをドキュメントIDとして使用（存在する場合）
                        let docId = '';
                        let currentId = 0;

                        if (item.staff_id) { docId = `staff_${item.staff_id}`; currentId = item.staff_id; }
                        else if (item.case_id) { docId = `case_${item.case_id}`; currentId = item.case_id; }
                        else if (item.customer_id) { docId = `cust_${item.customer_id}`; currentId = item.customer_id; }
                        else if (item.office_id) { docId = `off_${item.office_id}`; currentId = item.office_id; }
                        else if (item.license_id) { docId = `lic_${item.license_id}`; currentId = item.license_id; }
                        else if (item.invoice_id) { docId = `inv_${item.invoice_id}`; currentId = item.invoice_id; }
                        else if (item.contact_id) { docId = `ct_${item.contact_id}`; currentId = item.contact_id; }

                        if (currentId > maxId) maxId = currentId;

                        if (docId) {
                            await db.collection(collectionName).doc(docId).set(item);
                        } else {
                            await db.collection(collectionName).add(item);
                        }
                    }

                    // Update Counters if applicable
                    if (['staff', 'government_offices', 'customers', 'cases', 'customer_licenses', 'contacts'].includes(collectionName)) {
                        // Mapping collection name to counter name if needed, assuming 1:1 for now or specific names
                        // common.js uses: 'customers', 'staff', 'government_offices' etc.
                        await db.collection('counters').doc(collectionName).set({ count: maxId }, { merge: true });
                        addLog(`${collectionName} のカウンターを ${maxId} に設定しました。`);
                    }

                    addLog(`${collectionName} の移行が完了しました。`, 'success');
                }
                status.textContent = 'すべての移行が完了しました！';
                addLog('全プロセスの終了。', 'success');
            } catch (err) {
                console.error(err);
                status.textContent = 'エラーが発生しました。詳細はコンソールを確認してください。';
                addLog(`エラー: ${err.message}`, 'error');
            }
        });
    </script>
</body>

</html>
