<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - LAPIS2</title>
    <!-- Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            background-color: var(--bg-body);
            background-image: radial-gradient(circle at center, #2c3e50 0%, #0f172a 100%);
            min-height: 100vh;
        }

        .login-card {
            background: rgba(255, 255, 255, 0.98);
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }

        .login-logo-img {
            max-width: 200px;
            /* Adjusted size */
            height: auto;
            margin-bottom: 32px;
        }

        /* Local overrides for login form */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
        }

        .btn-login {
            width: 100%;
            margin-top: 12px;
            height: 48px;
            font-size: 1rem;
            justify-content: center;
        }

        .login-footer {
            margin-top: 32px;
            font-size: 0.85rem;
            color: var(--text-muted);
        }
    </style>
</head>

<body>
    <div class="login-card">
        <!-- Logo -->
        <h1
            style="margin: 0 0 24px 0; color: var(--primary); font-family: 'Inter', sans-serif; font-weight: 700; font-size: 2rem;">
            LAPIS2
        </h1>
        <!-- If you want to use the image instead:
        <img src="lapis_logo.png" alt="LAPIS Logo" class="login-logo-img">
        -->

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">メールアドレス</label>
                <input type="email" id="login-email" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="login-pass">パスワード</label>
                <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">ログイン</button>
        </form>

        <div class="login-footer">
            &copy; 2026 LAPIS2 Project
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="login.js"></script>
</body>

</html>
