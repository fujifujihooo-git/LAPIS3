<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>決算期別一覧 - LAPIS2</title>
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Local overrides */
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">
                    <span style="color: var(--primary);">✦</span> LAPIS2
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">案件管理</span>
                    </a>
                </li>

                <li class="nav-header">Management</li>
                <li class="nav-item">
                    <a href="customer_list.html">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">顧客管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_list.html">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">許認可管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="invoice_list.html">
                        <span class="nav-icon">💰</span>
                        <span class="nav-label">請求管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales_list.html">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">売上管理</span>
                    </a>
                </li>

                <li class="nav-header">Settings</li>
                <li class="nav-item">
                    <a href="license_washout.html" class="active">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">決算期別一覧</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="staff_list.html">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">担当者管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">
                        <span class="nav-icon">🏛️</span>
                        <span class="nav-label">官公庁マスタ</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted); display: none;">☰</button>
                    <h1 class="page-title">決算期別一覧</h1>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Actions Bar -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">顧客の決算月ごとの一覧を表示します。</p>
                    <button class="btn btn-secondary" id="btn-export-excel">
                        <span>📊</span> Excel出力
                    </button>
                </div>

                <!-- Search & Filters -->
                <div class="block">
                    <div class="block-header">
                        <h3 class="block-title">検索条件</h3>
                        <div style="font-size: 0.85rem; color: var(--text-muted);" id="count-display">表示件数：0件</div>
                    </div>
                    <div class="block-content">
                        <div class="filter-bar">
                            <div class="filter-item">
                                <label for="filter-fiscal-month">決算月</label>
                                <select id="filter-fiscal-month" class="form-select">
                                    <option value="">すべて</option>
                                    <option value="1">1月</option>
                                    <option value="2">2月</option>
                                    <option value="3">3月</option>
                                    <option value="4">4月</option>
                                    <option value="5">5月</option>
                                    <option value="6">6月</option>
                                    <option value="7">7月</option>
                                    <option value="8">8月</option>
                                    <option value="9">9月</option>
                                    <option value="10">10月</option>
                                    <option value="11">11月</option>
                                    <option value="12">12月</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label for="filter-search">検索 (顧客名・代表者名)</label>
                                <input type="text" id="filter-search" class="form-control" placeholder="顧客名・代表者名で検索...">
                            </div>
                            <div class="filter-item">
                                <label for="filter-staff">担当者</label>
                                <select id="filter-staff" class="form-select">
                                    <option value="">すべて</option>
                                    <!-- JS populated -->
                                </select>
                            </div>
                            <!-- License Type not in original but good to have? Original had it? Check original. 
                                 Original: filter-license-type, filter-search, filter-fiscal-month
                            -->
                            <div class="filter-item">
                                <label for="filter-license-type">許認可種別</label>
                                <select id="filter-license-type" class="form-select">
                                    <option value="">すべて</option>
                                    <!-- JS populated -->
                                </select>
                            </div>

                            <div class="filter-item" style="padding-bottom: 2px;">
                                <button id="btn-search-execute" class="btn btn-primary" style="width: 100%;">
                                    <span>🔍</span> 検索
                                </button>
                            </div>
                            <div class="filter-item" style="padding-bottom: 2px; flex: 0;">
                                <button id="btn-reset-filters" class="btn btn-secondary">リセット</button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Results Table -->
                <div class="block">
                    <div class="block-content" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="table-modern" id="license-table">
                                <!-- ID kept as license-table per original -->
                                <thead>
                                    <tr>
                                        <!-- Original Columns check: Customer, fiscal month, license type, number, expiry, staff -->
                                        <th class="sortable" data-sort="customer_name">顧客名</th>
                                        <th class="sortable" data-sort="ceo_name">代表者名</th>
                                        <!-- Added per likely need but check old code -->
                                        <th class="sortable" data-sort="fiscal_month">決算月</th>
                                        <th class="sortable" data-sort="license_type">許認可種別</th>
                                        <th class="sortable" data-sort="expiration_date">有効期限</th>
                                        <th class="sortable" data-sort="staff_name">外務担当者</th>
                                    </tr>
                                </thead>
                                <tbody id="license-list-body">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>
            </main>
        </div>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
    </div>

    <!-- Back to top -->
    <button id="back-to-top" class="back-to-top" style="
        position: fixed; right: 20px; bottom: 20px; 
        width: 40px; height: 40px; border-radius: 50%; 
        background: var(--primary); color: #fff; border: none; 
        font-size: 1.2rem; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.3s;
        z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    ">↑</button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.17.0/xlsx.full.min.js"></script>
    <!-- Original uses this? -->
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="license_washout.js"></script>

    <script>
        document.getElementById('mobile-toggle')?.addEventListener('click', function () {
            document.body.classList.toggle('sidebar-open');
        });

        const btnTop = document.getElementById('back-to-top');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                btnTop.style.opacity = '1';
                btnTop.style.pointerEvents = 'auto';
            } else {
                btnTop.style.opacity = '0';
                btnTop.style.pointerEvents = 'none';
            }
        });
        btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    </script>
</body>

</html>
