<!DOCTYPE html>
<html lang="ja">

<head>
    <meta name="google-site-verification" content="fmf6dKTEMqsG9Oudg3dR_ovFH5px_gmC--lvk27dMJE" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>テストデータ作成 - LAPIS3</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }

        h1 {
            color: #667eea;
            margin-bottom: 10px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s;
            width: 100%;
            margin-top: 20px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .info-box {
            background: #f0f7ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin: 20px 0;
            border-radius: 4px;
        }

        .info-box h3 {
            margin-top: 0;
            color: #667eea;
        }

        .info-box ul {
            margin: 10px 0;
            padding-left: 20px;
        }

        .log {
            background: #f5f5f5;
            border: 1px solid #ddd;
            padding: 15px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            max-height: 300px;
            overflow-y: auto;
            margin-top: 20px;
            display: none;
        }

        .log.active {
            display: block;
        }

        .log-entry {
            margin: 5px 0;
        }

        .log-entry.success {
            color: #28a745;
        }

        .log-entry.error {
            color: #dc3545;
        }

        .loading {
            text-align: center;
            padding: 20px;
            display: none;
        }

        .loading.active {
            display: block;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🚀 テストデータ作成ツール</h1>
        <p class="subtitle">売上リスト機能の検証用データを自動生成します</p>

        <div class="info-box">
            <h3>📋 作成されるデータ</h3>
            <ul>
                <li>顧客: 2件 （株式会社サンプル商事、テスト株式会社）</li>
                <li>官公庁: 1件 （東京都）</li>
                <li>許認可種別: 1件 （建設業許可）</li>
                <li>案件: 2件 （新規申請、更新申請）</li>
                <li>請求項目: 2件 （合計 550,000円）</li>
                <li>入金情報: 2件 （合計 550,000円）</li>
            </ul>
        </div>

        <button id="createDataBtn" onclick="createTestData()">
            ✨ テストデータを作成
        </button>

        <div id="loading" class="loading">
            <div class="spinner"></div>
            <p>データ作成中...</p>
        </div>

        <div id="log" class="log"></div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>

    <script>
        function addLog(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = message;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        async function createTestData() {
            const btn = document.getElementById('createDataBtn');
            const loading = document.getElementById('loading');
            const logDiv = document.getElementById('log');

            btn.disabled = true;
            loading.classList.add('active');
            logDiv.classList.add('active');
            logDiv.innerHTML = '';

            const db = firebase.firestore();
            addLog('🚀 総合テストデータの作成を開始...');

            try {
                const timestamp = firebase.firestore.Timestamp.now();
                const futureDate = firebase.firestore.Timestamp.fromDate(new Date('2026-04-01'));

                // 1. Staff Data (5 records)
                addLog('スタッフデータを作成中...');
                const staffList = [
                    { id: '101', name: '鈴木 太郎', role: '行政書士' },
                    { id: '102', name: '佐藤 花子', role: '補助者' },
                    { id: '103', name: '田中 次郎', role: '行政書士' },
                    { id: '104', name: '山田 建太', role: '営業' },
                    { id: '105', name: '高橋 事務', role: '事務' }
                ];

                for (const s of staffList) {
                    await db.collection('staff').doc(`staff_${s.id}`).set({
                        staff_id: s.id,
                        staff_name: s.name,
                        role: s.role,
                        status: '在籍',
                        joined_date: timestamp
                    });
                }
                addLog('✅ スタッフデータを作成完了 (5件)', 'success');

                // 2. Government Offices (5 records)
                addLog('官公庁データを作成中...');
                const offices = [
                    { id: 1, name: '東京法務局', pref: '東京都', type: '国' },
                    { id: 2, name: '東京都庁 建設業課', pref: '東京都', type: '都道府県' },
                    { id: 3, name: '神奈川県庁', pref: '神奈川県', type: '都道府県' },
                    { id: 4, name: '新宿区役所', pref: '東京都', type: '市区町村' },
                    { id: 5, name: '横浜市役所', pref: '神奈川県', type: '市区町村' }
                ];

                for (const o of offices) {
                    await db.collection('government_offices').doc(`gov_${o.id}`).set({
                        office_id: o.id, // Number
                        office_name: o.name,
                        office_prefecture: o.pref,
                        office_type: o.type,
                        status: '有効'
                    });
                }
                addLog('✅ 官公庁データを作成完了 (5件)', 'success');

                // 3. Customers (10 records)
                addLog('顧客データを作成中...');
                const customers = [];
                for (let i = 1; i <= 10; i++) {
                    const id = (10000 + i).toString();
                    const name = i % 2 === 0 ? `株式会社 サンプル建設${i}` : `有限会社 テスト興業${i}`;
                    customers.push({ id, name });
                    await db.collection('customers').doc(`cust_${i.toString().padStart(3, '0')}`).set({
                        customer_id: id,
                        customer_name: name,
                        customer_kana: 'カブシキガイシャ サンプル',
                        status: '稼働中',
                        representative_name: `代表 ${i}郎`,
                        phone: `03-1234-${i.toString().padStart(4, '0')}`,
                        created_at: timestamp
                    });
                }
                addLog('✅ 顧客データを作成完了 (10件)', 'success');

                // 4. Cases (20 records)
                addLog('案件データを作成中...');
                const licenseTypes = ['建設業許可', '宅建業免許', '産廃収集運搬', '古物商許可'];
                const statuses = ['受任', '作成中', '申請準備完了', '完了', '請求済'];

                for (let i = 1; i <= 20; i++) {
                    const cust = customers[i % 10];
                    const StaffId = staffList[i % 5].id;
                    const status = statuses[i % 5];

                    // Create dummy document ID
                    const docId = `case_${i.toString().padStart(3, '0')}`;
                    const caseData = {
                        case_id: `C${20000 + i}`,
                        customer_id: cust.id,
                        customer_name: cust.name,
                        license_type: licenseTypes[i % 4],
                        procedure_name: '新規申請',
                        status: status,
                        field_staff_id: StaffId, // String
                        document_staff_id: StaffId, // String
                        application_scheduled_date: status === '受任' ? futureDate : timestamp,
                        created_date: timestamp,
                        updated_date: timestamp,
                        fee: 150000 + (i * 1000)
                    };

                    await db.collection('cases').doc(docId).set(caseData);
                }
                addLog('✅ 案件データを作成完了 (20件)', 'success');

                addLog('🎉 総合テストデータの作成が完了しました！', 'success');
                alert('✅ テストデータの作成が完了しました！\n\n各画面（案件管理、顧客管理、官公庁マスタなど）でデータを確認してください。');

            } catch (error) {
                console.error('エラー:', error);
                addLog('❌ エラーが発生しました: ' + error.message, 'error');
                alert('❌ エラー: ' + error.message);
            } finally {
                btn.disabled = false;
                loading.classList.remove('active');
            }
        }
    </script>
</body>

</html>
