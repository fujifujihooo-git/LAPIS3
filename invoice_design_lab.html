<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAPIS3 請求書デザインモック・比較ラボ</title>
    <!-- Google Fonts: Noto Sans JP & Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Zen+Old+Mincho:wght@600;700&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root {
            --bg-canvas: #0f172a;
            --panel-bg: #1e293b;
            --panel-border: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Noto Sans JP', sans-serif;
            background-color: var(--bg-canvas);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            overflow-x: hidden;
        }

        /* ===== Header Bar ===== */
        header {
            background: rgba(30, 41, 59, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--panel-border);
            padding: 12px 24px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #10b981, #059669);
            color: #fff;
            font-size: 11px;
            font-weight: 700;
            padding: 3px 8px;
            border-radius: 6px;
            letter-spacing: 0.5px;
        }

        .header-title {
            font-size: 16px;
            font-weight: 700;
            color: #fff;
        }

        .header-subtitle {
            font-size: 12px;
            color: var(--text-muted);
        }

        /* ===== Tab Navigation ===== */
        .tab-nav {
            display: flex;
            background: #0f172a;
            padding: 4px;
            border-radius: 10px;
            border: 1px solid var(--panel-border);
            gap: 4px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 7px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: all 0.2s ease;
        }

        .tab-btn:hover {
            color: #fff;
            background: rgba(255, 255, 255, 0.05);
        }

        .tab-btn.active {
            background: var(--accent);
            color: #fff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.35);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-action {
            background: #334155;
            border: 1px solid #475569;
            color: #f8fafc;
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .btn-action:hover {
            background: #475569;
            color: #fff;
        }

        .btn-print {
            background: linear-gradient(135deg, #059669, #10b981);
            border: none;
        }
        .btn-print:hover {
            background: linear-gradient(135deg, #047857, #059669);
        }

        /* ===== Main Container ===== */
        .workspace {
            display: flex;
            flex: 1;
            overflow: hidden;
            position: relative;
        }

        /* ===== Control Sidebar ===== */
        .sidebar {
            width: 340px;
            background: var(--panel-bg);
            border-right: 1px solid var(--panel-border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 65px);
        }

        .sidebar-section {
            background: #0f172a;
            border: 1px solid var(--panel-border);
            border-radius: 12px;
            padding: 16px;
        }

        .section-title {
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #94a3b8;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .design-card {
            background: #1e293b;
            border: 1px solid var(--panel-border);
            border-radius: 10px;
            padding: 14px;
            margin-bottom: 10px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .design-card:hover {
            border-color: var(--accent);
            transform: translateY(-2px);
        }

        .design-card.active {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.1);
        }

        .design-card-title {
            font-size: 14px;
            font-weight: 700;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .design-card-badge {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }

        .badge-slate { background: #334155; color: #94a3b8; }
        .badge-navy { background: #1e3a8a; color: #93c5fd; }
        .badge-emerald { background: #064e3b; color: #6ee7b7; }
        .badge-minimal { background: #27272a; color: #e4e4e7; }

        .design-card-desc {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 6px;
            line-height: 1.5;
        }

        .points-list {
            margin-top: 8px;
            padding-left: 16px;
            font-size: 11px;
            color: #cbd5e1;
            line-height: 1.6;
        }

        /* ===== Preview Stage ===== */
        .preview-stage {
            flex: 1;
            background: #090d16;
            padding: 40px 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            background-image: radial-gradient(#1e293b 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .comparison-wrapper {
            display: flex;
            gap: 40px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .sheet-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .sheet-label {
            font-size: 14px;
            font-weight: 700;
            color: #cbd5e1;
            background: #1e293b;
            padding: 6px 16px;
            border-radius: 20px;
            border: 1px solid #334155;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* ===== A4 Sheet Base (Exact Ratio) ===== */
        .a4-sheet {
            width: 210mm;
            min-height: 297mm;
            padding: 20mm 20mm;
            background: #ffffff;
            color: #1e293b;
            box-shadow: 0 20px 45px rgba(0, 0, 0, 0.6), 0 0 0 1px rgba(255, 255, 255, 0.1);
            border-radius: 2px;
            position: relative;
            box-sizing: border-box;
            transform-origin: top center;
            transition: transform 0.2s ease;
        }

        /* ======================================================== */
        /* =================== THEME 0: CURRENT =================== */
        /* ======================================================== */
        .theme-current {
            font-family: 'Noto Sans JP', sans-serif;
            color: #1e293b;
        }
        .theme-current .doc-title {
            text-align: center;
            font-size: 26px;
            font-weight: 700;
            letter-spacing: 12px;
            margin-bottom: 4px;
            color: #1e293b;
        }
        .theme-current .doc-title-line {
            width: 80px;
            height: 2px;
            background: #1e293b;
            margin: 0 auto 20px auto;
        }
        .theme-current .header-grid {
            display: flex;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        .theme-current .customer-box {
            max-width: 60%;
        }
        .theme-current .customer-name {
            font-size: 15px;
            font-weight: 700;
            border-bottom: 1.5px solid #1e293b;
            padding-bottom: 2px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .theme-current .customer-address {
            font-size: 9.5px;
            color: #4b5563;
            line-height: 1.4;
        }
        .theme-current .meta-box {
            text-align: right;
            font-size: 10px;
            color: #374151;
            line-height: 1.6;
        }
        .theme-current .issuer-box {
            display: flex;
            justify-content: flex-end;
            margin-bottom: 16px;
            position: relative;
        }
        .theme-current .issuer-inner {
            width: 250px;
            text-align: left;
            position: relative;
        }
        .theme-current .issuer-logo {
            max-width: 220px;
            height: auto;
            max-height: 50px;
            object-fit: contain;
        }
        .theme-current .issuer-rep {
            font-size: 10px;
            margin-top: 4px;
            padding-left: 12px;
            color: #1f2937;
        }
        .theme-current .hanko-img {
            position: absolute;
            right: 0;
            top: -10px;
            width: 65px;
            height: 65px;
            opacity: 0.9;
        }
        .theme-current .amount-box {
            background: #e6f3e6;
            border: 1.5px solid #006400;
            border-radius: 4px;
            padding: 10px 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .theme-current .amount-label {
            font-size: 12px;
            font-weight: 700;
            color: #000;
        }
        .theme-current .amount-value {
            font-size: 20px;
            font-weight: 800;
            color: #000;
        }
        .theme-current .items-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 20px;
            font-size: 11px;
        }
        .theme-current .items-table th {
            background: #e6f3e6;
            color: #1e293b;
            border: 1px solid #006400;
            padding: 6px 8px;
            font-weight: 700;
            text-align: center;
        }
        .theme-current .items-table td {
            border: 1px solid #006400;
            padding: 6px 8px;
            color: #1e293b;
        }
        .theme-current .items-table .subtotal-row td {
            background: #fff;
            font-weight: 700;
            border: 1px solid #006400;
        }
        .theme-current .items-table .nontax-header td {
            background: #e6f3e6;
            font-weight: 700;
            font-size: 10px;
            border: 1px solid #006400;
        }
        .theme-current .items-table .total-row td {
            background: #e6f3e6;
            font-weight: 800;
            font-size: 13px;
            border: 1px solid #006400;
        }
        .theme-current .footer-grid {
            display: flex;
            gap: 20px;
            font-size: 10px;
        }
        .theme-current .footer-col {
            flex: 1;
        }
        .theme-current .footer-title {
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 4px;
        }
        .theme-current .disclaimer {
            font-size: 8px;
            color: #6b7280;
            line-height: 1.5;
            margin-top: 8px;
        }

        /* ======================================================== */
        /* ============ THEME A: MODERN SLATE & NAVY ============= */
        /* ======================================================== */
        .theme-modern {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            color: #0f172a;
        }
        .theme-modern .top-accent-bar {
            height: 4px;
            background: linear-gradient(90deg, #1e293b 0%, #3b82f6 50%, #60a5fa 100%);
            margin: -20mm -20mm 15mm -20mm;
        }
        .theme-modern .header-section {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 24px;
        }
        .theme-modern .doc-badge-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .theme-modern .doc-badge {
            display: inline-block;
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1.5px;
            color: #3b82f6;
            text-transform: uppercase;
        }
        .theme-modern .doc-main-title {
            font-size: 26px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: 4px;
        }
        .theme-modern .meta-table {
            font-size: 10px;
            color: #64748b;
            border-spacing: 0;
            line-height: 1.6;
        }
        .theme-modern .meta-table td:first-child {
            padding-right: 12px;
            color: #94a3b8;
            font-weight: 500;
        }
        .theme-modern .meta-table td:last-child {
            font-weight: 600;
            color: #1e293b;
            text-align: right;
        }

        .theme-modern .address-issuer-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 24px;
            align-items: flex-start;
        }
        .theme-modern .client-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-left: 3px solid #3b82f6;
            border-radius: 6px;
            padding: 14px 16px;
        }
        .theme-modern .client-card-label {
            font-size: 9px;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 4px;
        }
        .theme-modern .client-name {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
        }
        .theme-modern .client-address {
            font-size: 9.5px;
            color: #475569;
            line-height: 1.45;
        }

        .theme-modern .issuer-card {
            position: relative;
            text-align: right;
            padding-right: 8px;
        }
        .theme-modern .issuer-logo {
            max-width: 180px;
            height: auto;
            max-height: 42px;
            margin-bottom: 6px;
        }
        .theme-modern .issuer-detail {
            font-size: 9.5px;
            color: #475569;
            line-height: 1.5;
        }
        .theme-modern .hanko-modern {
            position: absolute;
            right: 0;
            top: -6px;
            width: 58px;
            height: 58px;
            opacity: 0.85;
        }

        /* Modern Amount Hero */
        .theme-modern .amount-hero {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            color: #fff;
            border-radius: 8px;
            padding: 14px 22px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            box-shadow: 0 4px 12px rgba(15, 23, 42, 0.15);
        }
        .theme-modern .amount-hero-title {
            font-size: 11px;
            font-weight: 600;
            color: #94a3b8;
            letter-spacing: 0.5px;
        }
        .theme-modern .amount-hero-sub {
            font-size: 9px;
            color: #64748b;
            margin-top: 2px;
        }
        .theme-modern .amount-hero-value {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: 0.5px;
            color: #ffffff;
            font-variant-numeric: tabular-nums;
        }

        /* Modern Crisp Table */
        .theme-modern .modern-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 24px;
        }
        .theme-modern .modern-table th {
            background: #f1f5f9;
            color: #475569;
            font-size: 10px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            padding: 9px 12px;
            border-bottom: 2px solid #cbd5e1;
            text-align: left;
        }
        .theme-modern .modern-table th.th-right { text-align: right; }
        .theme-modern .modern-table th.th-center { text-align: center; }
        .theme-modern .modern-table td {
            padding: 10px 12px;
            font-size: 11px;
            color: #1e293b;
            border-bottom: 1px solid #e2e8f0;
        }
        .theme-modern .modern-table .td-num {
            font-variant-numeric: tabular-nums;
            font-weight: 600;
        }
        .theme-modern .modern-table .row-subtotal td {
            border-bottom: 1px solid #cbd5e1;
            color: #64748b;
            font-size: 10.5px;
            padding: 7px 12px;
        }
        .theme-modern .modern-table .row-nontax-header td {
            background: #f8fafc;
            color: #0f172a;
            font-weight: 700;
            font-size: 10px;
            padding: 6px 12px;
            border-top: 1px solid #e2e8f0;
            border-bottom: 1px solid #e2e8f0;
        }
        .theme-modern .modern-table .row-grandtotal td {
            border-top: 2px solid #0f172a;
            border-bottom: 2px solid #0f172a;
            background: #f8fafc;
            color: #0f172a;
            font-size: 13px;
            font-weight: 800;
            padding: 10px 12px;
        }

        .theme-modern .footer-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
            font-size: 9.5px;
        }
        .theme-modern .info-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 12px 14px;
        }
        .theme-modern .info-card-header {
            font-size: 10px;
            font-weight: 700;
            color: #0f172a;
            margin-bottom: 6px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .theme-modern .bank-table {
            width: 100%;
            line-height: 1.5;
            color: #334155;
        }
        .theme-modern .bank-table td:first-child {
            color: #64748b;
            width: 60px;
        }
        .theme-modern .disclaimer-box {
            font-size: 8px;
            color: #64748b;
            line-height: 1.45;
        }

        /* ======================================================== */
        /* ============ THEME B: EXECUTIVE FOREST EMERALD ======== */
        /* ======================================================== */
        .theme-executive {
            font-family: 'Noto Sans JP', sans-serif;
            color: #1f2937;
        }
        .theme-executive .header-banner {
            border-bottom: 2px solid #047857;
            padding-bottom: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
        }
        .theme-executive .doc-title-exec {
            font-size: 24px;
            font-weight: 700;
            letter-spacing: 6px;
            color: #064e3b;
            font-family: 'Zen Old Mincho', serif;
        }
        .theme-executive .exec-meta {
            text-align: right;
            font-size: 9.5px;
            color: #4b5563;
            line-height: 1.5;
        }
        .theme-executive .meta-highlight {
            color: #047857;
            font-weight: 600;
        }

        .theme-executive .split-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 20px;
            gap: 20px;
        }
        .theme-executive .exec-client {
            flex: 1;
            padding: 8px 0;
        }
        .theme-executive .exec-client-name {
            font-size: 16px;
            font-weight: 700;
            color: #111827;
            border-bottom: 1.5px solid #047857;
            padding-bottom: 4px;
            margin-bottom: 8px;
            display: inline-block;
        }
        .theme-executive .exec-issuer {
            width: 260px;
            text-align: right;
            position: relative;
        }
        .theme-executive .exec-hanko {
            position: absolute;
            right: 0;
            top: -4px;
            width: 60px;
            height: 60px;
            opacity: 0.88;
        }

        .theme-executive .exec-amount-bar {
            background: #ecfdf5;
            border: 1px solid #6ee7b7;
            border-left: 5px solid #059669;
            border-radius: 4px;
            padding: 10px 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 22px;
        }
        .theme-executive .exec-amount-title {
            font-size: 12px;
            font-weight: 700;
            color: #064e3b;
        }
        .theme-executive .exec-amount-val {
            font-size: 22px;
            font-weight: 800;
            color: #064e3b;
            font-variant-numeric: tabular-nums;
        }

        .theme-executive .exec-table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 22px;
            font-size: 11px;
        }
        .theme-executive .exec-table th {
            background: #064e3b;
            color: #ffffff;
            font-weight: 600;
            padding: 7px 10px;
            border: 1px solid #064e3b;
            text-align: center;
            font-size: 10.5px;
        }
        .theme-executive .exec-table td {
            border: 1px solid #d1fae5;
            padding: 8px 10px;
            color: #1f2937;
        }
        .theme-executive .exec-table tbody tr:nth-child(even) td {
            background: #fbfdfc;
        }
        .theme-executive .exec-table .row-sub td {
            background: #fff;
            border-top: 1px solid #9ca3af;
            font-weight: 600;
            color: #4b5563;
        }
        .theme-executive .exec-table .row-nontax td {
            background: #ecfdf5;
            color: #064e3b;
            font-weight: 700;
            border: 1px solid #a7f3d0;
        }
        .theme-executive .exec-table .row-total td {
            background: #ecfdf5;
            color: #064e3b;
            font-weight: 800;
            font-size: 13px;
            border: 1.5px solid #059669;
        }

        /* ======================================================== */
        /* ============ THEME C: MINIMALIST PURE ================== */
        /* ======================================================== */
        .theme-minimal {
            font-family: 'Plus Jakarta Sans', 'Noto Sans JP', sans-serif;
            color: #18181b;
        }
        .theme-minimal .minimal-header {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            border-bottom: 1px solid #18181b;
            padding-bottom: 14px;
            margin-bottom: 24px;
        }
        .theme-minimal .minimal-title {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
        }
        .theme-minimal .minimal-meta {
            font-size: 10px;
            color: #71717a;
            display: flex;
            gap: 20px;
        }
        .theme-minimal .minimal-meta strong {
            color: #18181b;
            font-weight: 600;
        }

        // Render Canvas Router
        function renderCanvas() {
            const container = document.getElementById('preview-stage');
            const data = sampleDataStandard;

            if (currentTheme === 'compare') {
                container.innerHTML = `
                    <div class="comparison-wrapper">
                        ${renderModernSheet(data)}
                        ${renderExecutiveSheet(data)}
                        ${renderMinimalSheet(data)}
                    </div>
                `;
            } else if (currentTheme === 'modern') {
                container.innerHTML = renderModernSheet(data);
            } else if (currentTheme === 'executive') {
                container.innerHTML = renderExecutiveSheet(data);
            } else if (currentTheme === 'minimal') {
                container.innerHTML = renderMinimalSheet(data);
            } else if (currentTheme === 'current') {
                container.innerHTML = renderCurrentSheet(data);
            }

            // Update explanation in sidebar
            document.getElementById('design-explanation').innerHTML = explanations[currentTheme] || '';

            // Apply Zoom
            applyZoom();

            // Refresh icons
            if (typeof lucide !== 'undefined') lucide.createIcons();
        }

        function switchTheme(theme) {
            currentTheme = theme;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.currentTarget.classList.add('active');
            renderCanvas();
        }

        function adjustZoom(delta) {
            currentZoom = Math.min(Math.max(currentZoom + delta, 0.5), 1.5);
            applyZoom();
        }

        function resetZoom() {
            currentZoom = 1.0;
            applyZoom();
        }

        function applyZoom() {
            document.getElementById('zoom-val').textContent = Math.round(currentZoom * 100) + '%';
            document.querySelectorAll('.a4-sheet').forEach(el => {
                el.style.transform = `scale(${currentZoom})`;
            });
        }

        function updateSampleData(type) {
            // Can extend with multi-items if needed
            renderCanvas();
        }

        // Init
        document.addEventListener('DOMContentLoaded', () => {
            renderCanvas();
        });
