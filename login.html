<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ログイン - LAPIS2</title>
    <!-- Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0;
            margin: 0;
            background-color: #000000;
            background-image: none;
            min-height: 100vh;
            color: #ffffff;
        }

        .login-card {
            background: #374254;
            padding: 48px;
            border-radius: 16px;
            box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .login-logo-img {
            max-width: 360px;
            width: 100%;
            height: auto;
            margin-bottom: 24px;
            display: block;
            margin-left: auto;
            margin-right: auto;
        }

        /* Local overrides for login form */
        .form-group {
            text-align: left;
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: var(--text-main);
        }

        .btn-login {
            width: 100%;
            margin-top: 12px;
            height: 48px;
            font-size: 13pt !important;
            /* Strict 13pt */
            justify-content: center;
        }

        .login-footer {
            margin-top: 32px;
            font-size: 13pt;
            /* Strict 13pt */
            color: #ffffff;
        }

        .login-card label {
            color: #ffffff;
            font-weight: 700;
            font-size: 13pt !important;
        }

        /* Input field color adjustment (Hybrid) & Typography */
        .login-card .form-control {
            background-color: #ffffff !important;
            color: #222222 !important;
            border-color: #ced4da;
            font-size: 13pt !important;
        }

        /* Prevent browser autofill from changing the background color and font size */
        .login-card .form-control:-webkit-autofill,
        .login-card .form-control:-webkit-autofill:hover,
        .login-card .form-control:-webkit-autofill:focus,
        .login-card .form-control:-webkit-autofill:active {
            -webkit-box-shadow: 0 0 0 30px #ffffff inset !important;
            -webkit-text-fill-color: #222222 !important;
            font-size: 13pt !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        .login-card .form-control::placeholder {
            color: #888888;
            font-size: 13pt !important;
        }

        .login-card .form-control:focus {
            background-color: #ffffff !important;
            color: #222222 !important;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(77, 144, 254, 0.3);
            font-size: 13pt !important;
        }

        .trust-device-label {
            color: #ffffff !important;
        }
    </style>
</head>

<body>
    <div class="login-card">
        <!-- Logo -->
        <img src="logo&amp;title_LAPIS2_03.png" alt="LAPIS2 Logo & Title" class="login-logo-img">

        <form id="login-form">
            <div class="form-group">
                <label for="login-email">メールアドレス</label>
                <input type="email" id="login-email" class="form-control" placeholder="example@mail.com" required>
            </div>
            <div class="form-group">
                <label for="login-pass">パスワード</label>
                <input type="password" id="login-pass" class="form-control" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary btn-login">ログイン</button>
        </form>

        <div class="login-footer">
            &copy; 2026 LAPIS2 Project
        </div>
    </div>

    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="js/auth_2fa.js"></script>
    <script src="login.js"></script>

    <!-- OTP Modal -->
    <div id="otp-modal" class="modal" style="display: none;">
        <div class="modal-content login-card" style="margin: 10% auto; padding: 40px; max-width: 500px;">
            <h2
                style="color: var(--primary); font-family: 'BIZ UDGothic', sans-serif; font-weight: 700; margin-bottom: 24px;">
                認証コード入力
            </h2>
            <p style="text-align: left; font-size: 1.1rem; margin-bottom: 20px;">
                メールに送信された6桁の数字を入力してください。
            </p>

            <form id="otp-form">
                <div class="form-group">
                    <label for="otp-code" style="font-size: 1.2rem;">認証コード</label>
                    <input type="text" id="otp-code" class="form-control" placeholder="123456" maxlength="6"
                        pattern="\d{6}" required
                        style="font-size: 2rem; letter-spacing: 0.5rem; text-align: center; height: 70px;">
                </div>

                <div class="form-group" style="text-align: center; margin-bottom: 24px;">
                    <input type="checkbox" id="trust-device-check"
                        style="transform: scale(1.5); margin-right: 10px; cursor: pointer;">
                    <label for="trust-device-check" class="trust-device-label"
                        style="display: inline-block; font-family: 'BIZ UDGothic', sans-serif; font-size: 1.1rem; font-weight: 700; cursor: pointer;">
                        このデバイスを30日間信頼する
                    </label>
                </div>

                <button type="submit" class="btn btn-primary btn-login"
                    style="height: 60px; font-size: 1.3rem; margin-top: 24px; background-color: #4D90FE;">
                    認証してログイン
                </button>
            </form>

            <div style="margin-top: 24px; text-align: center;">
                <button id="btn-resend-otp" class="btn btn-secondary" style="font-size: 1rem;">
                    コードを再送信
                </button>
                <div style="margin-top: 16px;">
                    <a href="#" id="link-back-login" style="color: var(--text-muted);">ログイン画面に戻る</a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
