<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>売上管理 - LAPIS2</title>
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Local overrides */
        .summary-card {
            background: linear-gradient(135deg, #ffffff 0%, #f8fbff 100%);
            border-left: 4px solid var(--primary);
        }
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">
                    <span style="color: var(--primary);">✦</span> LAPIS2
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">案件管理</span>
                    </a>
                </li>

                <li class="nav-header">Management</li>
                <li class="nav-item">
                    <a href="customer_list.html">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">顧客管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_list.html">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">許認可管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="invoice_list.html">
                        <span class="nav-icon">💰</span>
                        <span class="nav-label">請求管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales_list.html" class="active">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">売上管理</span>
                    </a>
                </li>

                <li class="nav-header">Settings</li>
                <li class="nav-item">
                    <a href="license_washout.html">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">決算期別一覧</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="staff_list.html">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">担当者管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">
                        <span class="nav-icon">🏛️</span>
                        <span class="nav-label">官公庁マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_types_list.html">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">許認可マスタ</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted); display: none;">☰</button>
                    <h1 class="page-title">売上管理</h1>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Actions Bar -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <p style="color: var(--text-muted); margin: 0; font-size: 0.9rem;">売上データの集計と分析を行います。</p>
                    <button class="btn btn-secondary" id="btn-export-csv">
                        <span>📥</span> CSVエクスポート
                    </button>
                </div>

                <!-- Search & Filters -->
                <div class="block">
                    <div class="block-header">
                        <h3 class="block-title">集計条件</h3>
                    </div>
                    <div class="block-content">
                        <div class="filter-bar">
                            <div class="filter-item">
                                <label for="filter-year-month">対象月</label>
                                <input type="month" id="filter-year-month" class="form-control">
                            </div>
                            <!-- Future expansion: Customer filter, Staff filter etc. -->
                            <!-- Current sales_list.js mainly uses month filter -->
                            <div class="filter-item" style="padding-bottom: 2px;">
                                <button id="btn-search-execute" class="btn btn-primary" style="width: 100%;">
                                    <span>🔍</span> 集計実行
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Sales Summary -->
                <div class="stats-grid">
                    <div class="stat-card-modern summary-card">
                        <div class="stat-info">
                            <div class="stat-label">売上総額 (税抜)</div>
                            <div class="stat-number" id="val-total-sales">¥0</div>
                        </div>
                        <div class="stat-icon-wrapper" style="background: #e0f2fe; color: #0369a1;">¥</div>
                    </div>
                    <div class="stat-card-modern">
                        <div class="stat-info">
                            <div class="stat-label">件数</div>
                            <div class="stat-number" id="val-total-count">0件</div>
                        </div>
                        <div class="stat-icon-wrapper">#</div>
                    </div>
                    <!-- Add more summary cards as needed -->
                </div>

                <!-- Results Table -->
                <div class="block">
                    <div class="block-header">
                        <h3 class="block-title">売上明細</h3>
                    </div>
                    <div class="block-content" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="table-modern" id="sales-table">
                                <thead>
                                    <tr>
                                        <th class="sortable" data-sort="date">売上日 (完了日)</th>
                                        <th class="sortable" data-sort="customer_name">顧客名</th>
                                        <th class="sortable" data-sort="title">案件名</th>
                                        <th class="sortable" data-sort="amount">売上金額 (税抜)</th>
                                        <th class="sortable" data-sort="staff_name">担当者</th>
                                    </tr>
                                </thead>
                                <tbody id="sales-list-body">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>
            </main>
        </div>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
    </div>

    <!-- Back to top -->
    <button id="back-to-top" class="back-to-top" style="
        position: fixed; right: 20px; bottom: 20px; 
        width: 40px; height: 40px; border-radius: 50%; 
        background: var(--primary); color: #fff; border: none; 
        font-size: 1.2rem; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.3s;
        z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    ">↑</button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="sales_list.js"></script>

    <script>
        document.getElementById('mobile-toggle')?.addEventListener('click', function () {
            document.body.classList.toggle('sidebar-open');
        });

        const btnTop = document.getElementById('back-to-top');
        window.addEventListener('scroll', () => {
            if (window.scrollY > 300) {
                btnTop.style.opacity = '1';
                btnTop.style.pointerEvents = 'auto';
            } else {
                btnTop.style.opacity = '0';
                btnTop.style.pointerEvents = 'none';
            }
        });
        btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    </script>
</body>

</html>
