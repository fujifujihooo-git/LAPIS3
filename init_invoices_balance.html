<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invoices Balance Initialization Script</title>
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { padding: 40px; background-color: #f8fafc; font-family: 'Inter', 'BIZ UDGothic', sans-serif; }
        .container { max-width: 800px; margin: 0 auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        h1 { font-size: 1.5rem; margin-bottom: 20px; color: #1e293b; }
        .log { margin-top: 20px; padding: 15px; background: #f1f5f9; border-radius: 8px; font-family: monospace; height: 300px; overflow-y: auto; font-size: 0.9rem; }
        .log-error { color: #ef4444; }
        .log-success { color: #10b981; }
        button { padding: 12px 24px; font-size: 1rem; cursor: pointer; border-radius: 6px; border: none; font-weight: 500; }
        .btn-primary { background: #3b82f6; color: white; }
        .btn-primary:hover { background: #2563eb; }
        .btn-primary:disabled { background: #94a3b8; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>既存請求データ (invoices) & 入金データ初期化スクリプト</h1>
        <p style="color: #64748b; margin-bottom: 24px;">
            このスクリプトは、既存の <code>invoices</code> および <code>receipts</code> コレクション内のドキュメントをチェックし、<br>
            <code>balance</code> フィールド等の未収処理・入金消込に必要な初期フィールドが設定されていない場合に追加します。
        </p>
        
        <button id="btn-start" class="btn-primary" disabled>
            <i data-lucide="play" style="width: 18px; height: 18px; vertical-align: middle; margin-right: 8px;"></i>
            初期化処理を開始する
        </button>

        <div id="logArea" class="log">
            実行ログがここに表示されます...
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js?v=20260312"></script>
    
    <script>
        lucide.createIcons();
        const btnStart = document.getElementById('btn-start');
        const logArea = document.getElementById('logArea');

        function appendLog(message, type = 'normal') {
            const div = document.createElement('div');
            if (type === 'error') div.className = 'log-error';
            if (type === 'success') div.className = 'log-success';
            div.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logArea.appendChild(div);
            logArea.scrollTop = logArea.scrollHeight;
        }

        // --- Auth Check ---
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                appendLog('ログイン状態の確認が完了しました。ユーザー: ' + user.email, 'success');
                btnStart.disabled = false;
            } else {
                appendLog('⚠️ ログインされていません。システムの他の画面（案件一覧など）でログインしてから、この画面を再読み込みしてください。', 'error');
                btnStart.disabled = true;
            }
        });

        async function runInitialization() {
            btnStart.disabled = true;
            appendLog('初期化処理を開始します...', 'normal');

            try {
                // 1. Invoices Initialization
                appendLog('--- Invoices のチェックを開始 ---', 'normal');
                const invoicesSnap = await db.collection('invoices').get();
                let updatedInvoicesCount = 0;

                const batch = db.batch(); // Firestore Batch limitation is 500, but assuming data is small for now
                let operationsCount = 0;

                for (const doc of invoicesSnap.docs) {
                    const data = doc.data();
                    let needsUpdate = false;
                    let updates = {};

                    // 1-1. Status Standardization (if needed, e.g., missing status)
                    if (!data.status) {
                        updates.status = '下書き';
                        needsUpdate = true;
                    }

                    // 1-2. Balance calculation
                    if (data.balance === undefined) {
                        const total = data.total_amount || 0;
                        const paid = data.paid_amount || 0;
                        updates.balance = total - paid;
                        needsUpdate = true;
                    }
                    
                    // 1-3. Allocated Amount (for allocation model, starting point is paid_amount)
                    if (data.allocatedAmount === undefined) {
                        updates.allocatedAmount = data.paid_amount || 0;
                        needsUpdate = true;
                    }

                    if (needsUpdate) {
                        batch.update(doc.ref, updates);
                        updatedInvoicesCount++;
                        operationsCount++;
                    }

                    // Handle batch limits if necessary (Firestore limit is 500)
                    if (operationsCount === 450) {
                        await batch.commit();
                        operationsCount = 0;
                        appendLog(`Batch commit executed (Invoices)`, 'normal');
                    }
                }

                if (operationsCount > 0) {
                    await batch.commit();
                }
                appendLog(`Invoices完了: ${updatedInvoicesCount}件のドキュメントを更新しました。`, 'success');

                // 2. Receipts Initialization (Migration from old Payments or just checking existing)
                // Note: If you want to migrate 'payments' to 'receipts', that requires different logic.
                // Here we just ensure any existing receipts have proper fields.
                appendLog('--- Receipts のチェックを開始 ---', 'normal');
                const receiptsSnap = await db.collection('receipts').get();
                let updatedReceiptsCount = 0;
                let receiptsBatchCount = 0;
                
                for (const doc of receiptsSnap.docs) {
                    const data = doc.data();
                    let needsUpdate = false;
                    let updates = {};

                    if (data.balance === undefined) {
                        // Assuming old receipts were fully used if no balance was recorded? 
                        // Or if we are just starting receipts, they might not exist yet.
                        updates.balance = data.amount || 0;
                        updates.allocatedAmount = 0;
                        needsUpdate = true;
                    }

                    if (data.status === undefined) {
                        updates.status = 'active';
                        needsUpdate = true;
                    }

                    if (needsUpdate) {
                        batch.update(doc.ref, updates);
                        updatedReceiptsCount++;
                        receiptsBatchCount++;
                    }

                    if (receiptsBatchCount === 450) {
                        await batch.commit();
                        receiptsBatchCount = 0;
                    }
                }

                if (receiptsBatchCount > 0) {
                    await batch.commit();
                }

                appendLog(`Receipts完了: ${updatedReceiptsCount}件のドキュメントを更新しました。`, 'success');

                appendLog('=== すべての初期化処理が完了しました ===', 'success');

            } catch (error) {
                console.error(error);
                appendLog(`エラーが発生しました: ${error.message}`, 'error');
            } finally {
                btnStart.disabled = false;
            }
        }

        btnStart.addEventListener('click', runInitialization);

    </script>
</body>
</html>
