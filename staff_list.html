<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>担当者管理 - LAPIS2</title>
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Local overrides */
        /* User requested 13pt for specific sections */
        .description-text,
        .block-title,
        .filter-item label,
        .filter-item .form-select,
        .filter-item .form-control {
            font-size: 13pt !important;
        }
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">
                    <span style="color: var(--primary);">✦</span> LAPIS2
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">案件管理</span>
                    </a>
                </li>

                <li class="nav-header">Management</li>
                <li class="nav-item">
                    <a href="customer_list.html">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">顧客管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_list.html">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">許認可管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="invoice_list.html">
                        <span class="nav-icon">💰</span>
                        <span class="nav-label">請求管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales_list.html">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">売上管理</span>
                    </a>
                </li>

                <li class="nav-header">Settings</li>
                <li class="nav-item">
                    <a href="license_washout.html">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">決算期別一覧</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="staff_list.html" class="active">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">担当者管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">
                        <span class="nav-icon">🏛️</span>
                        <span class="nav-label">官公庁マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_types_list.html">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">許認可マスタ</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <h1 class="page-title">担当者管理</h1>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Actions Bar -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <p class="description-text" style="color: var(--text-muted); margin: 0;">自社の担当者情報を管理します。</p>
                    <button id="btn-new-staff" class="btn btn-new">
                        <i data-lucide="plus"></i> 新規担当者登録
                    </button>
                </div>

                <!-- Search & Filters -->
                <div class="block">
                    <div class="block-header">
                        <h3 class="block-title">検索条件</h3>
                    </div>
                    <div class="block-content">
                        <div class="filter-bar">
                            <div class="filter-item">
                                <label for="filter-status">状態</label>
                                <select id="filter-status" class="form-select">
                                    <option value="在籍">在籍</option>
                                    <option value="休職">休職</option>
                                    <option value="退職">退職</option>
                                    <option value="">すべて</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label for="filter-role">役割</label>
                                <select id="filter-role" class="form-select">
                                    <option value="">すべて</option>
                                    <option value="行政書士">行政書士</option>
                                    <option value="補助者">補助者</option>
                                    <option value="事務員">事務員</option>
                                    <option value="その他">その他</option>
                                </select>
                            </div>
                            <div class="filter-item" style="flex: 2;">
                                <label for="search-name">担当者名</label>
                                <input type="text" id="search-name" class="form-control" placeholder="名前またはフリガナで検索...">
                            </div>
                        </div>

                        <!-- Moved Buttons to new line, right aligned -->
                        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                            <button class="btn btn-reset" id="btn-reset" style="padding: 8px 16px;"><i
                                    data-lucide="rotate-ccw"></i> リセット</button>
                            <button id="btn-search" class="btn btn-search" style="padding: 8px 24px;">
                                <i data-lucide="search"></i> 検索
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Results Table -->
                <div class="block" id="results-section-staff" style="display: none;">
                    <div class="block-header">
                        <h3 class="block-title">担当者一覧</h3>
                    </div>
                    <div class="block-content" style="padding: 0;">
                        <div class="table-responsive">
                            <table class="table-modern" id="staff-table">
                                <thead>
                                    <tr>
                                        <!-- Original: ID, Status, Name, Dept, Role, Email, Last Updated -->
                                        <th class="sortable" data-sort="staff_id" style="width: 80px;">ID</th>
                                        <th class="sortable" data-sort="status" style="width: 80px;">状態</th>
                                        <th class="sortable" data-sort="staff_name">担当者名</th>
                                        <th class="sortable" data-sort="department">所属部署</th>
                                        <th class="sortable" data-sort="role">役割</th>
                                        <th class="sortable" data-sort="email">メールアドレス</th>
                                        <th class="sortable" data-sort="last_updated">最終更新</th>
                                    </tr>
                                </thead>
                                <tbody id="staff-list-body">
                                    <!-- JSで動的に追加 -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>



                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>
            </main>
        </div>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
    </div>

    <!-- Back to top -->
    <button id="back-to-top" class="back-to-top" style="
        position: fixed; right: 20px; bottom: 20px; 
        width: 40px; height: 40px; border-radius: 50%; 
        background: var(--primary); color: #fff; border: none; 
        font-size: 1.2rem; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.3s;
        z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    ">↑</button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="staff_list.js"></script>
</body>

</html>
