<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>顧客管理 - LAPIS2</title>
    <!-- New Modern Style -->
    <link rel="stylesheet" href="style_modern.css?v=1">
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=BIZ+UDGothic:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        /* Local overrides */

        /* 13pt font for description and search section */
        .description-text {
            font-size: 13pt !important;
            color: var(--text-muted);
            margin: 0;
        }

        .block-title,
        .filter-item label,
        .filter-item .form-select,
        .filter-item .form-control {
            font-size: 13pt !important;
        }
    </style>
</head>

<body>
    <div id="page-container">
        <!-- Sidebar -->
        <nav id="sidebar">
            <div class="sidebar-header">
                <a href="index.html" class="logo-text">
                    <span style="color: var(--primary);">✦</span> LAPIS2
                </a>
            </div>

            <ul class="sidebar-nav">
                <li class="nav-header">Main</li>
                <li class="nav-item">
                    <a href="index.html">
                        <span class="nav-icon">📊</span>
                        <span class="nav-label">案件管理</span>
                    </a>
                </li>

                <li class="nav-header">Management</li>
                <li class="nav-item">
                    <a href="customer_list.html" class="active">
                        <span class="nav-icon">🏢</span>
                        <span class="nav-label">顧客管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_list.html">
                        <span class="nav-icon">📜</span>
                        <span class="nav-label">許認可管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="invoice_list.html">
                        <span class="nav-icon">💰</span>
                        <span class="nav-label">請求管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="sales_list.html">
                        <span class="nav-icon">📈</span>
                        <span class="nav-label">売上管理</span>
                    </a>
                </li>

                <li class="nav-header">Settings</li>
                <li class="nav-item">
                    <a href="license_washout.html">
                        <span class="nav-icon">📅</span>
                        <span class="nav-label">決算期別一覧</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="staff_list.html">
                        <span class="nav-icon">👥</span>
                        <span class="nav-label">担当者管理</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="government_office_list.html">
                        <span class="nav-icon">🏛️</span>
                        <span class="nav-label">官公庁マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="license_types_list.html">
                        <span class="nav-icon">📋</span>
                        <span class="nav-label">許認可マスタ</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="backup.html">
                        <span class="nav-icon">💾</span>
                        <span class="nav-label">バックアップ管理</span>
                    </a>
                </li>
            </ul>
        </nav>
        <!-- END Sidebar -->

        <!-- Main Container -->
        <div id="main-container">
            <!-- Header -->
            <header id="header">
                <div class="header-left">
                    <button id="mobile-toggle"
                        style="background:none; border:none; font-size:1.5rem; cursor:pointer; color: var(--text-muted);">☰</button>
                    <h1 class="page-title">顧客管理</h1>
                </div>
                <div class="header-right" id="header-right">
                    <!-- User Status injected here -->
                </div>
            </header>
            <!-- END Header -->

            <!-- Page Content -->
            <main id="page-content">

                <!-- Actions Bar -->
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <p class="description-text">顧客情報の検索・登録・編集を行います。</p>
                    <button id="btn-new-customer" class="btn btn-new">
                        <i data-lucide="plus"></i> 新規顧客登録
                    </button>
                </div>

                <div class="block">
                    <div class="block-header">
                        <h3 class="block-title">検索条件</h3>
                    </div>
                    <div class="block-content">
                        <div class="filter-bar">
                            <div class="filter-item">
                                <label for="filter-status">状態</label>
                                <select id="filter-status" class="form-select">
                                    <option value="">すべて</option>
                                    <option value="稼働中" selected>稼働中</option>
                                    <option value="休眠">休眠</option>
                                    <option value="取引終了">取引終了</option>
                                </select>
                            </div>
                            <div class="filter-item">
                                <label for="filter-search">顧客名・フリガナ</label>
                                <input type="text" id="filter-search" class="form-control" placeholder="顧客名またはカナで検索...">
                            </div>
                            <div class="filter-item">
                                <label for="filter-phone">電話番号</label>
                                <input type="text" id="filter-phone" class="form-control" placeholder="番号で検索...">
                            </div>
                        </div>
                        <!-- ボタンを下部に分離 -->
                        <div style="margin-top: 20px; display: flex; gap: 10px; justify-content: flex-end;">
                            <button id="btn-reset-filters" class="btn btn-reset" style="padding: 8px 16px;"><i
                                    data-lucide="rotate-ccw"></i> リセット</button>
                            <button id="btn-search-execute" class="btn btn-search" style="padding: 8px 24px;">
                                <i data-lucide="search"></i> 検索
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Initial Message -->
                <div id="initial-message" class="block text-center" style="padding: 40px;">
                    <p style="color: var(--text-muted); font-size: 1.1rem; margin: 0;">顧客名または電話番号で検索してください。</p>
                </div>

                <!-- Results Table -->
                <div class="block" id="table-wrapper" style="display: none;">
                    <div class="block-header" style="border-bottom: none; padding-bottom: 0;">
                        <div style="flex: 1;"></div>
                        <div id="count-display-area" style="font-size: 0.9rem; color: var(--text-muted);">
                            <span id="count-display">表示件数：0件</span>
                        </div>
                    </div>
                    <div class="block-content" style="padding-top: 10px;">
                        <div class="table-responsive">
                            <table class="table-modern" id="customer-table">
                                <thead>
                                    <tr>
                                        <th class="sortable" data-sort="customer_id" style="width: 80px;">ID</th>
                                        <th class="sortable" data-sort="status" style="width: 100px;">状態</th>
                                        <th class="sortable" data-sort="customer_name">顧客名</th>
                                        <th class="sortable" data-sort="customer_type">区分</th>
                                        <th class="sortable" data-sort="representative_name">代表者</th>
                                        <th class="sortable" data-sort="phone">電話番号</th>
                                        <th class="sortable" data-sort="last_updated">最終更新</th>
                                    </tr>
                                </thead>
                                <tbody id="customer-list-body">
                                    <!-- JS Populated -->
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>

                <footer style="margin-top: 60px; text-align: center; color: #aaa; font-size: 0.8rem;">
                    &copy; 2026 LAPIS2 Project
                </footer>
            </main>
        </div>

        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" onclick="document.body.classList.remove('sidebar-open')"></div>
    </div>

    <!-- Back to top -->
    <button id="back-to-top" class="back-to-top" style="
        position: fixed; right: 20px; bottom: 20px; 
        width: 40px; height: 40px; border-radius: 50%; 
        background: var(--primary); color: #fff; border: none; 
        font-size: 1.2rem; cursor: pointer; opacity: 0; pointer-events: none; transition: 0.3s;
        z-index: 1000; box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    ">↑</button>

    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="common.js"></script>
    <script src="customer_list.js"></script>

    <script>
    const btnTop = document.getElementById('back-to-top');
    window.addEventListener('scroll', () => {
    if (window.scrollY > 300) {
    btnTop.style.opacity = '1';
    btnTop.style.pointerEvents = 'auto';
    } else {
    btnTop.style.opacity = '0';
    btnTop.style.pointerEvents = 'none';
    }
    });
    btnTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
    </script>
</body>

</html>
